<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Zen Kaku Gothic New','MS PGothic',sans-serif;font-size:12px;background:#d8d8d8;color:#111;min-height:100vh;padding-top:44px}

/* ヘッダー */
#hdr{position:fixed;top:0;left:0;width:100%;background:#333;color:#fff;z-index:999;display:flex;align-items:center;padding:5px 16px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
#hdr-title{font-size:14px;font-weight:bold;flex:1}
#hdr-right{display:flex;align-items:center;gap:8px;font-size:11px}
.hbtn{padding:3px 10px;font-size:11px;cursor:pointer;border:none;border-radius:2px;color:#fff;font-family:inherit}

/* コンテナ */
.container{max-width:960px;margin:0 auto;padding:14px 12px 30px}

/* 認証 */
#auth_box{background:#fff;border-radius:6px;padding:18px;margin-bottom:14px;border:1px solid #ccc;text-align:center}
#auth_box h2{font-size:12px;font-weight:bold;color:#555;margin-bottom:10px}
.auth-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;justify-content:center}
.a-inp{border:1px solid #bbb;padding:4px 8px;font-size:12px;font-family:inherit;border-radius:2px;width:200px;max-width:100%;outline:none}
.a-inp:focus{border-color:#5588cc}
.a-btn{padding:4px 14px;font-size:12px;cursor:pointer;border:none;border-radius:2px;color:#fff;font-family:inherit}
#auth_msg{font-size:11px;margin-top:4px}

/* ツールバー */
#toolbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#toolbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
#new_btn{display:flex;align-items:center;gap:5px;padding:6px 16px;font-size:12px;cursor:pointer;background:#2a7a4a !important;color:#fff !important;border:none;border-radius:3px;font-family:inherit;font-weight:bold;white-space:nowrap}
#counter_btn,#status_btn,#menu_btn{padding:2px 10px;font-size:12px;cursor:pointer;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:3px;transition:all .2s}
#counter_btn:hover,#status_btn:hover,#menu_btn:hover{border-color:var(--accent);color:var(--accent)}
#menu_btn{font-size:17px;line-height:1;padding:1px 9px}
#index_menu{position:fixed;background:var(--surface);border:1px solid var(--border);border-radius:5px;box-shadow:0 4px 16px rgba(0,0,0,.35);min-width:150px;z-index:99999;overflow:hidden}
#index_menu .menu-item{padding:10px 16px;cursor:pointer;font-size:13px;color:var(--text);display:flex;align-items:center;gap:8px}
#index_menu .menu-item:hover{background:var(--surface2)}
.menu-sep{height:1px;background:var(--border);margin:2px 0}
#new_btn:hover{background:#1a6a3a}
#search_box{flex:1;min-width:180px;max-width:340px;border:1px solid #bbb;border-radius:3px;padding:5px 10px;font-size:12px;font-family:inherit;outline:none;background:#fff}
#search_box:focus{border-color:#5588cc}
#search_hint{font-size:10px;color:#aaa}

/* グリッド2列 */
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

/* カード */
.card{background:var(--surface);border-radius:5px;border:1px solid var(--border);overflow:hidden;transition:box-shadow .15s}
.card:hover{box-shadow:0 3px 10px rgba(0,0,0,.15)}
.card-top{display:flex;align-items:stretch;gap:0}
.card-bar{width:5px;flex-shrink:0}
.card-icon{flex-shrink:0;width:56px;align-self:stretch;overflow:hidden;border-right:1px solid var(--border)}
.card-info{flex:1;padding:8px 10px;min-width:0}
.card-tag-row{display:flex;align-items:center;gap:5px;margin-bottom:2px}
.card-furigana{font-size:9px;color:#555 !important;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-pcname{font-size:15px;font-weight:bold;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.card-job{font-size:11px;color:#222 !important;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.card-meta{display:flex;gap:4px;font-size:11px;flex-wrap:wrap;align-items:center}
.card-tokucho{font-size:10px;margin-top:3px;line-height:1.45;display:flex;flex-wrap:wrap;column-gap:12px;row-gap:2px;margin-left:-0.35em}
.card-tokucho .meta-value{margin-right:0;color:#555 !important}
body:not(.light) .card-tokucho .meta-value{color:#aaa !important}
body.light .card-tokucho .meta-value{color:#555 !important}
.meta-label{color:#aaa}
.meta-value{color:#222;margin-right:6px}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:bold;white-space:nowrap}
.s-alive{background:#d4f5e4;color:#1a7a45}
.s-lost{background:#fde8e8;color:#b03030}
.s-permalost{background:#f3cccc;color:#7a1111}
.s-retired{background:#e8eef5;color:#3a5a8a}
.s-missing{background:#fff3d4;color:#8a6000}
.s-dead{background:#e6d9f7;color:#5e2b9e}
.s-insane{background:#f0e4ff;color:#6a1a9a}
/* 並び替え・フィルタ・タグ・状態 */
#ctrlbar{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
#ctrlbar label{font-size:11px;color:var(--text-muted)}
#ctrlbar select{font-size:12px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text)}
#sort_dir{font-size:12px;padding:3px 9px;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text)}
#tag_filter{display:flex;flex-wrap:wrap;gap:5px;margin:3px 0 4px}
/* ライトモード：件数・並び替え等のラベルを濃い灰色に */
body.light #search_hint{color:#555}
body.light #ctrlbar label{color:#555}
/* タグ絞込みアコーディオン（スマホのみ表示） */
#tagfilter_toggle{display:none;font-size:12px;padding:4px 10px;margin:4px 0;cursor:pointer;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);align-items:center;gap:6px}
.tagchip{font-size:11px;padding:2px 9px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;user-select:none}
.tagchip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tagchip.ex{background:#c0392b;color:#fff;border-color:#c0392b;text-decoration:line-through}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;align-items:center}
.card-tag{font-size:10px;padding:1px 7px;border-radius:9px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.card-tag-edit{font-size:10px;padding:1px 7px;border-radius:9px;background:transparent;color:var(--accent2);border:1px dashed var(--border);cursor:pointer}
.card-tags-foot{flex:1;margin-top:0;min-width:0}
.badge{cursor:pointer}
#status_pop{position:fixed;z-index:99999;background:var(--surface);border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.35);padding:4px;display:none}
#status_pop button{display:block;width:100%;text-align:left;font-size:12px;padding:7px 14px;border:none;background:transparent;color:var(--text);cursor:pointer;border-radius:4px;white-space:nowrap}
#status_pop button:hover{background:var(--surface2)}
#status_pop .pop-ic{display:inline-flex;width:22px;height:22px;border-radius:4px;background:#2b2b2d;align-items:center;justify-content:center;margin-right:8px;vertical-align:middle}
#status_pop .pop-ic img{width:17px;height:17px;object-fit:contain}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:6px;font-size:12px;z-index:100000;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:.95}
/* 一括選択・見出し */
.card{position:relative}
.card-check{position:absolute;top:6px;left:6px;width:20px;height:20px;z-index:5;display:none;cursor:pointer}
#grid.select-mode .card-check{display:block}
#grid.select-mode .card{cursor:pointer}
#grid.select-mode .card-foot .cbtn{display:none}
#grid.select-mode .card-tag-edit{display:none}
#grid.select-mode .card.sel{outline:2px solid var(--accent);outline-offset:-2px}
.group-head{grid-column:1/-1;font-size:13px;font-weight:bold;color:var(--accent);border-bottom:2px solid var(--border);padding:6px 4px 3px;margin-top:4px}
#select_toggle{font-size:12px;padding:3px 9px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);cursor:pointer}
#select_toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#bulkbar{display:none;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0;padding:6px 10px;background:var(--surface2);border:1px solid var(--accent);border-radius:6px}
#bulkbar.shown{display:flex}
#bulkbar.on{position:sticky;top:44px;z-index:50}
#bulkbar:not(.on) .bulk-only{display:none}
#bulkbar button{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
#bulkbar .bulk-danger{margin-left:auto;color:#fff;background:#e05555;border-color:#e05555}
#bulk_count{font-size:12px;color:var(--text);font-weight:bold}
/* タグ編集モーダル */
#tag_editor_overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100001;display:none;align-items:center;justify-content:center;padding:20px}
#tag_editor_overlay.on{display:flex}
#tag_editor{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.te-title{font-size:14px;font-weight:bold;margin-bottom:4px;color:var(--text)}
.te-sub{font-size:11px;color:var(--text-muted);margin-bottom:10px}
#te_chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;min-height:24px}
.te-chip{font-size:12px;padding:3px 10px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;user-select:none}
.te-chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.te-empty{font-size:11px;color:var(--text-muted)}
.te-add{display:flex;gap:6px;margin-bottom:14px}
.te-add input{flex:1;min-width:0;font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text)}
.te-add button{font-size:12px;padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:var(--surface2);color:var(--text);cursor:pointer;white-space:nowrap}
.te-actions{display:flex;justify-content:flex-end;gap:8px}
.te-actions button{font-size:13px;padding:6px 16px;border-radius:5px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.te-actions .te-save{background:var(--accent);color:#fff;border-color:var(--accent)}
/* タグ管理モーダル */
#tag_manage_overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100001;display:none;align-items:center;justify-content:center;padding:20px}
/* 誕生日一覧 */
#bday_overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100001;display:none;align-items:center;justify-content:center;padding:20px}
#bday_overlay.on{display:flex}
#bday_box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;width:100%;max-width:460px;max-height:85vh;display:flex;flex-direction:column;color:var(--text)}
#bday_list{overflow:auto;margin-top:8px;font-size:12px;line-height:1.55}
.bd-row{display:flex;align-items:flex-start;gap:8px;padding:1px 0}
.bd-date{flex:0 0 auto;width:5.4em;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bd-row.has .bd-date{color:var(--text);font-weight:bold}
.bd-names{flex:1;min-width:0}
.bd-name{cursor:pointer;text-decoration:none;color:var(--accent);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-name:hover{text-decoration:underline}
.bd-month{position:sticky;top:0;background:var(--surface);font-weight:bold;font-size:12px;padding:4px 0 2px;border-bottom:1px solid var(--border);margin-top:6px;color:var(--accent2)}
.bd-unknown{margin-top:10px;border-top:1px dashed var(--border);padding-top:6px;font-size:11px;color:var(--text-muted)}
#tag_manage_overlay.on{display:flex}
#tag_manage{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;width:100%;max-width:360px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#tm_list{display:flex;flex-direction:column;gap:6px;margin:10px 0 14px}
.tm-row{display:flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:5px;padding:4px 6px;background:var(--surface2)}
.tm-name{flex:1;min-width:0;font-size:13px;color:var(--text);border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:3px}
.tm-name:focus{background:var(--surface);outline:none;border-color:var(--accent)}
.tm-handle{cursor:grab;font-size:15px;line-height:1;color:var(--text-muted);user-select:none;padding:2px 5px;touch-action:none}
.tm-handle:active{cursor:grabbing}
.tm-row.dragging{opacity:.6;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tm-btn{font-size:11px;padding:2px 7px;border:1px solid var(--border);border-radius:4px;background:var(--surface);color:var(--text);cursor:pointer}
.tm-del{color:#e05555;border-color:#e0a0a0}
.tm-add{display:flex;gap:5px;margin-bottom:8px}
.tm-add input{flex:1;min-width:0;font-size:13px;color:var(--text);border:1px solid var(--border);background:var(--surface);padding:5px 7px;border-radius:5px}
.tm-add input:focus{outline:none;border-color:var(--accent)}
.tm-add button{font-size:12px;padding:4px 12px;border:1px solid var(--accent);border-radius:5px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.card-foot{display:flex;align-items:center;padding:5px 10px;border-top:1px solid var(--border);background:var(--surface2);gap:6px}
.card-date{font-size:10px;color:#bbb;flex:1}
.cbtn{padding:2px 9px;font-size:11px;cursor:pointer;border:none;border-radius:2px;font-family:inherit}

/* ローディング・空 */
#loading{text-align:center;padding:50px;color:#aaa;font-size:13px;grid-column:1/-1}
#empty{text-align:center;padding:40px;color:#bbb;font-size:13px;grid-column:1/-1;display:none}
#no_result{text-align:center;padding:20px;color:#bbb;font-size:12px;grid-column:1/-1;display:none}

@media(max-width:600px){
  body{padding-top:44px}
  .container{padding:8px 8px 24px}
  #grid{grid-template-columns:1fr !important}
  #toolbar{flex-wrap:wrap;gap:6px}
  #toolbar-right{width:100%;display:flex;gap:6px}
  #toolbar-right #search_box{flex:1;max-width:none}
  .card-foot{flex-wrap:wrap}
  #new_btn{padding:5px 12px}
  #search_box{max-width:100%}
  .auth-row{flex-direction:column;align-items:stretch}
  .a-inp{width:100% !important;box-sizing:border-box}
  /* タグ絞込みをアコーディオン化（スマホ） */
  #tagfilter_toggle{display:flex;width:100%;justify-content:center;box-sizing:border-box}
  #tag_filter{display:none}
  #tag_filter.open{display:flex}
}

/* ===== カラーテーマ ===== */
:root{
  --bg:#0d0d12;
  --surface:#16161f;
  --surface2:#1e1e2e;
  --border:#4a4a63;
  --accent:#c8a97e;
  --accent2:#7e9ec8;
  --text:#e8e4da;
  --text-muted:#8a8499;
  --header-bg:#333;
  --shadow:rgba(0,0,0,0.4);
  --hover:rgba(200,169,126,0.07);
}
body.light{
  --bg:#fff;
  --surface:#ffffff;
  --surface2:#eeeeee;
  --border:#cccccc;
  --accent:#555555;
  --accent2:#3366aa;
  --text:#111;
  --text-muted:#7a6e62;
  --header-bg:#333;
  --shadow:rgba(0,0,0,0.12);
  --hover:rgba(0,0,0,0.04);
}
body{
  background:var(--bg);
  color:var(--text);
  transition:background .25s,color .25s;
}
/* ヘッダー */
#hdr,#sticky-header{
  background:#333 !important;
  border-bottom:1px solid var(--border);
  transition:background .25s;
}
body.light #hdr,body.light #sticky-header{
  background:#333 !important;
}
/* カード・サーフェス */
.card,.char-card,#auth_box,.sheet{background:var(--surface) !important}
.card-foot,.card-body{background:var(--surface2) !important}
.card{border-color:var(--border) !important}
.card:hover{box-shadow:0 3px 12px var(--shadow) !important}
/* テーブル・入力 */
td,th{border-color:var(--border) !important}
th{background:#252535 !important;color:var(--text) !important}
body.light th{background:#ddd8ce !important;color:var(--text) !important}
input[type=text],input[type=number],textarea,select{
  background:var(--surface) !important;
  color:var(--text) !important;
  border-color:var(--border) !important;
}
/* アコーディオン */
.acc-header,.sub-acc-header,.sub2-acc-header,.hdr{
  background:#252535 !important;
  color:var(--text) !important;
}
body.light .acc-header,body.light .sub-acc-header,
body.light .sub2-acc-header,body.light .hdr{
  background:#444 !important;
  color:#fff !important;
}
.acc-body,.sub-acc-body,.sub2-acc-body,.section{
  background:var(--surface2) !important;
}
/* pts-remain */
.pts-remain.ok{color:#7ec8a0 !important}
body.light .pts-remain.ok{color:#2a7a4a !important}
.pts-remain.warn{color:#c8b07e !important}
.pts-remain.over{color:#e05c5c !important;animation:blink .7s step-end infinite}
/* バッジ */
.s-alive{background:#1a3a2a;color:#7ec8a0}
.s-lost{background:#3a1a1a;color:#c87e7e}
.s-permalost{background:#4d1616;color:#e19a9a}
.s-retired{background:#1a2a3a;color:#7e9ec8}
.s-missing{background:#3a2a0a;color:#c8b07e}
.s-dead{background:#2e1f42;color:#b58ee0}
.s-insane{background:#2a1a3a;color:#b07ec8}
body.light .s-alive{background:#d4f5e4;color:#1a7a45}
body.light .s-lost{background:#fde8e8;color:#b03030}
body.light .s-permalost{background:#f3cccc;color:#7a1111}
body.light .s-retired{background:#e8eef5;color:#3a5a8a}
body.light .s-missing{background:#fff3d4;color:#8a6000}
body.light .s-dead{background:#e6d9f7;color:#5e2b9e}
body.light .s-insane{background:#f0e4ff;color:#6a1a9a}
/* コンテナ・パネル */
.container{background:transparent !important}
.personal-data,.right-panel{background:var(--surface) !important}
.personal-data table{background:var(--surface) !important}
/* toolbar */
#toolbar{background:transparent}
#search_box,.a-inp{
  background:var(--surface) !important;
  color:var(--text) !important;
  border-color:var(--border) !important;
}
#new_btn{background:#2a7a4a !important;color:#fff !important;border:none !important;}
/* ボタン */
.add-row-btn{background:var(--surface2) !important;color:var(--accent) !important;border-color:var(--border) !important}
/* pts-bar */
.pts-bar{background:#333345 !important}
body.light .pts-bar{background:#ccc8be !important}
/* sticky-pt-block */
.sticky-pt-block{background:#252535 !important}
body.light .sticky-pt-block{background:#ccc !important}
/* テーマ切り替えボタン */
#theme_btn{
  padding:2px 10px;font-size:12px;cursor:pointer;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);border-radius:3px;transition:all .2s;
}
#theme_btn:hover{border-color:var(--accent);color:var(--accent)}
/* fafafa → surface2 */
[style*="background:#fafafa"],[style*="background: #fafafa"]{background:var(--surface2) !important}
[style*="background:#f8f8f8"]{background:var(--surface2) !important}
[style*="background:#f0f0f0"]{background:var(--surface2) !important}
[style*="color:#333"]{color:var(--text) !important}
[style*="color:#444"]{color:var(--text) !important}
[style*="color:#555"]{color:var(--text-muted) !important}

/* ===== テーマ修正パッチ ===== */

/* ライトモードのヘッダー文字色 */


body.light .sticky-pt-block span,
body.light .sticky-pt-block div{
  color:#111 !important;
}

/* 能力値テーブル・パーソナルデータ・技能テーブル背景を統一 */
.personal-data,
.personal-data table,
.personal-data td,
.section,
.skill-table,
.skill-table td,
.skill-table th,
table td, table tr{
  background:var(--surface) !important;
}
/* th だけ少し暗く */
th, .skill-table th{
  background:var(--surface2) !important;
  color:var(--text) !important;
}
body.light th,
body.light .skill-table th{
  background:#ddd8ce !important;
  color:var(--text) !important;
}

/* derived（灰色の計算欄）*/
.derived{
  background:var(--surface2) !important;
  color:var(--text) !important;
}

/* 不定エリア */
.fute-table td[style*="background:#444"],
.fute-table td[style*="background:#555"]{
  background:var(--surface2) !important;
  color:var(--text) !important;
}
body.light .fute-table td[style*="background:#444"],
body.light .fute-table td[style*="background:#555"]{
  background:#444 !important;
  color:#fff !important;
}

/* ライトモードのヘッダーは濃い色に */
body.light #sticky-header,
body.light #hdr{
  background:#333 !important;
  color:#fff !important;
}
body.light #sticky-header *,
body.light #hdr *{
  color:#fff !important;
}
body.light .pts-remain.ok{color:#2a7a4a !important}
body.light #sticky-pcname{color:#fff !important}

/* セクション区切りラベル */
.skill-sec-hdr{
  background:var(--surface2) !important;
  color:var(--text) !important;
}
/* 技能初期値 */
.sk-base{color:var(--text-muted) !important}

/* row-label */
.row-label{
  background:var(--surface2) !important;
  color:var(--text) !important;
}

/* 不定の白背景tdをsurfaceに */
.fute-table td[style*="background:#fff"]{
  background:var(--surface) !important;
}

/* テーマボタンカラー修正 */
body.light #theme_btn{
  background:rgba(255,255,255,0.2);
  border-color:rgba(255,255,255,0.4);
  color:#fff;
}
body.light #counter_btn,body.light #status_btn,body.light #menu_btn{
  background:rgba(255,255,255,0.2);
  border-color:rgba(255,255,255,0.4);
  color:#fff;
}


/* ===== テーマ修正パッチ2 ===== */

/* 技能表ヘッダー・不定ヘッダーをテーマに合わせる */
body.light .hdr,
body.light .acc-header,
body.light .sub-acc-header,
body.light .sub2-acc-header,
body.light .skill-sec-hdr{
  background:#444 !important;
  color:#f8f4ee !important;
}
/* sectionの背景をsurfaceに統一 */
body.light .section{
  background:var(--surface) !important;
  border-color:var(--border) !important;
}
body:not(.light) .section{
  background:var(--surface2) !important;
  border-color:var(--border) !important;
}
/* 不定の内容・期間ラベルをhdrと統一 */
body.light .fute-table td[style*="background:#444"],
body.light .fute-table td[style*="background:#555"]{
  background:#444 !important;
  color:#f8f4ee !important;
}
body:not(.light) .fute-table td[style*="background:#444"],
body:not(.light) .fute-table td[style*="background:#555"]{
  background:#252535 !important;
  color:var(--text) !important;
}

/* 職業P・興味P ライトモード */
body.light .sticky-pt-block{
  background:rgba(90,74,58,0.15) !important;
  color:#111 !important;
}
body.light .sticky-pt-block span,
body.light .sticky-pt-block div{
  color:#111 !important;
}
body.light #job_remain,
body.light #int_remain,
body.light #job_remain_sp,
body.light #int_remain_sp{
  color:#2a7a4a !important;
}
body.light .pts-bar{
  background:#ccc !important;
  border-color:#aaa !important;
}

/* PC名ライトモード */
body.light #sticky-pcname{
  color:#f8f4ee !important;
}
/* ライトモードのヘッダー区切り線 */
body.light #sticky-header > div:first-child > div:nth-child(2){
  background:#666 !important;
}

/* ダークモード skill-sec-hdr */
body:not(.light) .skill-sec-hdr{
  background:#252535 !important;
  color:var(--text) !important;
}
body:not(.light) .hdr,
body:not(.light) .acc-header,
body:not(.light) .sub-acc-header,
body:not(.light) .sub2-acc-header{
  background:#252535 !important;
  color:var(--text) !important;
}
body:not(.light) .sticky-pt-block{
  background:#252535 !important;
  color:var(--text) !important;
}
body:not(.light) .pts-remain.ok{ color:#7ec8a0 !important }


/* ===== テーマ修正パッチ3: ライトモード白黒系 ===== */

/* ライトモードのヘッダーを黒系に戻す */
body.light #sticky-header,
body.light #hdr{
  background:#333 !important;
  color:#fff !important;
}
body.light #sticky-header *,
body.light #hdr *,
body.light #sticky-pcname{
  color:#fff !important;
}
body.light .sticky-pt-block{
  background:#444 !important;
  color:#fff !important;
}
body.light .sticky-pt-block span,
body.light .sticky-pt-block div{
  color:#fff !important;
}
body.light #job_remain,
body.light #int_remain,
body.light #job_remain_sp,
body.light #int_remain_sp{
  color:#4dbb88 !important;
}
body.light .pts-bar{
  background:#666 !important;
  border-color:#555 !important;
}

/* ライトモードのhdr・acc-headerを黒系に */
body.light .hdr,
body.light .acc-header,
body.light .sub-acc-header,
body.light .sub2-acc-header,
body.light .skill-sec-hdr{
  background:#444 !important;
  color:#fff !important;
}

/* ライトモードの不定ラベルを黒系に */
body.light .fute-table td[style*="background:#444"],
body.light .fute-table td[style*="background:#555"]{
  background:#444 !important;
  color:#fff !important;
}

/* ライトモードのsectionを白系に */
body.light .section{
  background:#fff !important;
  border-color:#ccc !important;
}
body.light .acc-body,
body.light .sub-acc-body,
body.light .sub2-acc-body{
  background:#f8f8f8 !important;
}

/* ライトモードth */
body.light th,
body.light .skill-table th{
  background:#444 !important;
  color:#fff !important;
}

/* ライトモードのテキストを黒に */
body.light{
  --text:#111 !important;
  --text-muted:#666 !important;
  --bg:#d8d8d8 !important;
  --surface:#fff !important;
  --surface2:#f0f0f0 !important;
  --border:#ccc !important;
}


/* ダークモード一覧: 文字色を見やすく */
body:not(.light) .card-furigana{ color:#aaa !important; }
body:not(.light) .card-job{ color:#ddd !important; }
body:not(.light) .meta-label{ color:#777 !important; }
body:not(.light) .meta-value{ color:#ccc !important; }
body:not(.light) .card-date{ color:#888 !important; }
body:not(.light) .card-pcname{ color:var(--text) !important; }

/* ライトモード一覧: 文字色 */
body.light .card-furigana{ color:#555 !important; }
body.light .card-job{ color:#111 !important; }


/* 一覧カードの白い線・ゴミ箱 */
body:not(.light) .card{ border-color:var(--border) !important; }
body:not(.light) .card-top{ border:none !important; }

/* ===== 表示切替アイコン（状態の右） ===== */
#vm_toggle{margin-left:auto;font-size:16px;padding:4px 10px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:6px;cursor:pointer;line-height:1}
#vm_toggle:hover{border-color:var(--accent)}
/* ===== アークナイツ風グリッド（横スクロール・ウィンドウ縦に2PC） ===== */
#grid.grid-ark{display:grid;grid-auto-flow:column;grid-template-columns:none !important;grid-template-rows:repeat(2,1fr);grid-auto-columns:calc((100dvh - 226px) * 0.235);gap:6px;overflow-x:auto;overflow-y:hidden;padding-bottom:8px;-webkit-overflow-scrolling:touch;height:calc(100dvh - 220px);min-height:380px}
#grid.grid-ark .group-head{display:none}
.ark-card{position:relative;height:100%;width:100%;border-radius:4px;overflow:hidden;background:#20202a;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.28);border:1px solid var(--border)}
.ark-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.45)}
.ark-img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.ark-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;color:#555;background:linear-gradient(135deg,#2a2a38,#1b1b24)}
.ark-status-dot{position:absolute;top:6px;right:6px;z-index:3;font-size:9px;font-weight:700;color:#fff;padding:1px 6px;border-radius:9px}
.ark-overlay{position:absolute;left:0;right:0;bottom:0;z-index:2;background:linear-gradient(transparent,rgba(0,0,0,.85) 45%);padding:24px 6px 5px}
.ark-botrow{display:flex;align-items:flex-end;gap:5px}
.ark-san{position:relative;flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:conic-gradient(#e2aa46 calc(var(--p,0)*1%),rgba(255,255,255,.16) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ark-san::before{content:'';position:absolute;inset:3px;border-radius:50%;background:rgba(20,20,26,.92)}
.ark-san .lab,.ark-san .val{position:relative}
/* ===== スターレイル風グリッド ===== */
/* PC・スマホとも1列3人。カード内の文字はカード幅に比例（cqw） */
#grid.grid-hsr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) !important;gap:8px}
#grid.grid-hsr .group-head{display:none}
.hsr-card{display:flex;aspect-ratio:1.375;container-type:inline-size;background:#2b2a30;border-radius:6px;overflow:hidden;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hsr-card:hover{filter:brightness(1.08)}
.hsr-pic{position:relative;flex:0 0 46%;background:linear-gradient(170deg,#d39a5c,#a36a3c 60%,#7a4a2a);overflow:hidden;border-radius:6px 0 0 6px}
.hsr-img{position:absolute;inset:0;background-repeat:no-repeat}
.hsr-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(18cqw,40px);color:rgba(255,255,255,.35);font-weight:700}
.hsr-icons{position:absolute;left:min(2cqw,5px);top:min(2cqw,5px);display:flex;flex-direction:column;gap:min(1.2cqw,3px);z-index:2}
.hsr-ic{width:min(12cqw,24px);height:min(12cqw,24px);border-radius:50%;background:rgba(20,20,26,.7);display:flex;align-items:center;justify-content:center}
.hsr-ic img{width:min(9cqw,18px);height:min(9cqw,18px);object-fit:contain}
.hsr-name{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:min(8cqw,16px) 4px 4px;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:min(6.7cqw,12px);line-height:1.25;text-align:center;font-weight:500;text-shadow:0 1px 2px #000;overflow:hidden;word-break:break-all}
.hsr-info{flex:1;min-width:0;padding:min(3.6cqw,8px);display:flex;flex-direction:column;gap:min(3cqw,6px);color:#ddd}
.hsr-top{display:flex;align-items:baseline;gap:4px}
.hsr-age{margin-left:auto;font-size:min(6.7cqw,12px);color:#ddd;white-space:nowrap}
.hsr-ic-act{cursor:pointer}
.hsr-ic-act:hover{background:rgba(70,70,90,.9)}
.hsr-lv{font-family:'Jost',sans-serif;font-size:min(9.1cqw,17px);font-weight:400;color:#eee;letter-spacing:.02em}
.hsr-lv span{font-size:min(6cqw,11px);color:#aaa;margin-right:3px}
.hsr-box{flex:1;min-height:0;background:rgba(255,255,255,.06);border-radius:4px;padding:min(2.4cqw,6px) min(3cqw,7px);overflow:hidden;display:flex;flex-direction:column;gap:min(1.2cqw,3px)}
.hsr-row{font-size:min(6.4cqw,12px);line-height:1.35;white-space:nowrap;overflow:hidden;color:#e6e6e6}
.hsr-tk{color:#e7c58a}
.ark-cls{position:absolute;top:0;left:0;z-index:3;width:34%;aspect-ratio:1;background:rgba(17,17,20,.82);display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);cursor:pointer}
.ark-cls:hover{background:rgba(60,60,70,.9)}
.ark-cls img{width:80%;height:80%;object-fit:contain;pointer-events:none}
/* SAN数字：Novecento Sans（端末にインストール済み or ./fonts/novecento.woff2 を置いた場合に使用）→ 無ければ形の近いJost */
@font-face{font-family:'ArkNum';font-weight:300 400;src:local('Novecento Sans Light'),local('NovecentoSans-Light'),local('Novecento sans wide Light'),local('NovecentosanswideLight'),url('./fonts/novecento.woff2') format('woff2'),url('./fonts/novecento.otf') format('opentype')}
.ark-san .lab{font-family:'ArkNum','Jost',sans-serif;font-size:8px;color:#e2aa46;font-weight:400;letter-spacing:.5px}
.ark-san .val{font-family:'ArkNum','Jost',sans-serif;font-size:22px;color:#fff;font-weight:300;margin-top:-1px;line-height:1}
.ark-acts{margin-left:auto;display:flex;gap:4px}
.ark-act{width:32px;height:32px;border-radius:3px;border:none;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;background:rgba(40,40,52,.82);color:#fff}
.ark-act:hover{background:var(--accent2)}
.ark-name{margin-top:4px;color:#fff;font-size:15px;font-weight:400;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;letter-spacing:.02em;text-align:right;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden}
</style>

function getSheet(char){
  if(char._sheet)return char._sheet;
  let s={};try{s=JSON.parse(char.data)||{};}catch(e){}
  char._sheet=s;return s;
}
function charTags(char){const s=getSheet(char);return Array.isArray(s.tags)?s.tags:[];}
function charStatus(char){return (getSheet(char).inputs||{}).pc_status||'alive';}
function charSan(char){const inp=getSheet(char).inputs||{};const v=parseInt(inp.san_now);if(!isNaN(v))return v;const p=parseInt(inp.pow);return isNaN(p)?null:p*5;}

function sortVal(char){
  const inp=getSheet(char).inputs||{};
  switch(sortKey){
    case 'name':   return (inp.pcname||char.char_name||'');
    case 'furigana': return kanaNorm(inp.furigana);
    case 'san':    return charSan(char);
    case 'status': return (S_ORDER[charStatus(char)]??9);
    case 'updated':return new Date(char.updated_at).getTime();
    default:
      if(AB_KEYS.includes(sortKey)){const n=parseInt(inp[sortKey]);return isNaN(n)?null:n;}
      return 0;
  }
}

function applyFilters(){

  const activeElem=(document.getElementById('elem_filter')||{}).value||'';

    if(activeStatus && charStatus(char)!==activeStatus)return false;
    if(viewMode==='hsr'){
      const ii=getSheet(char).inputs||{};
      const ok=(act,v)=>{ if(!act)return true; v=String(parseInt(v)||''); return act==='none'?v==='':v===act; };
      if(!ok(activeElem,ii.hsr_elem)||!ok(activePath,ii.hsr_path))return false;

    if(viewMode==='ark' && activeCls){ const ci=String(parseInt((getSheet(char).inputs||{}).ark_class)||''); if(activeCls==='none'?ci!=='':ci!==activeCls)return false; }
    if(activeTags.size){const tg=charTags(char);if(![...activeTags].some(t=>tg.includes(t)))return false;}
    if(excludeTags.size){const tg=charTags(char);if([...excludeTags].some(t=>tg.includes(t)))return false;}
    if(q){
      const s=getSheet(char);const inp=s.inputs||{};
      const hay=[(inp.pcname||char.char_name||''),(inp.furigana||''),(inp.job||''),
        tokuchoLabel(inp.t1_sel)+' '+(inp.t1_memo||''),tokuchoLabel(inp.t2_sel)+' '+(inp.t2_memo||''),
        (s.scenarios||[]).join(' '),charTags(char).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
  const dir=(sortDir==='asc'?1:-1);
  rows.sort((a,b)=>{
    const va=sortVal(a), vb=sortVal(b);
    if(sortKey==='name'||sortKey==='furigana'){
      const sa=String(va||''), sb=String(vb||'');
      if(sortKey==='furigana'){ if(!sa&&!sb)return 0; if(!sa)return 1; if(!sb)return -1; }
      return sa.localeCompare(sb,'ja')*dir;
    }
    const an=(va==null),bn=(vb==null);
    if(an&&bn)return 0; if(an)return 1; if(bn)return -1;
    return (va-vb)*dir;
  });

}

/* ===== 誕生日一覧 ===== */
const _BD_MDAYS=[31,29,31,30,31,30,31,31,30,31,30,31]; // 2/29も表示（うるう年対応）
// sheetの誕生日（自由入力）から 月/日 を抽出。「1月1日」「1/1」「01-01」「1.1」「2000/1/1」等に対応
function parseBirthday(s){
  if(!s)return null;
  const t=String(s).trim().replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  let m=t.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*日?/);                       // 1月1日
  if(!m) m=t.match(/(?:\d{4}\s*[\/\-.年]\s*)?(\d{1,2})\s*[\/\-.]\s*(\d{1,2})(?!\s*[\/\-.]\s*\d)/); // 1/1, 2000/1/1
  if(!m) return null;
  const mo=parseInt(m[1],10), d=parseInt(m[2],10);
  if(!(mo>=1&&mo<=12))return null;
  if(!(d>=1&&d<=_BD_MDAYS[mo-1]))return null;
  return {m:mo,d:d};
}
function openBirthdayList(){

    const bd=parseBirthday(inp.birthday);
    if(!bd){ if((inp.birthday||'').trim()) unknown.push(name+'（'+inp.birthday.trim()+'）'); return; }
    const k=bd.m+'-'+bd.d;

function buildTagFilter(){
  const all=new Set();
  allChars.forEach(c=>charTags(c).forEach(t=>all.add(t)));
  [...activeTags].forEach(t=>{if(!all.has(t))activeTags.delete(t);});
  [...excludeTags].forEach(t=>{if(!all.has(t))excludeTags.delete(t);});
  const wrap=document.getElementById('tag_filter');
  if(!wrap)return;
  const _tgl=document.getElementById('tagfilter_toggle');
  if(all.size===0){wrap.innerHTML=''; if(_tgl)_tgl.style.display='none'; return;}
  if(_tgl)_tgl.style.display='';
  wrap.innerHTML=orderedTags().map(t=>{
    const cls=activeTags.has(t)?'on':(excludeTags.has(t)?'ex':'');
    const tip=activeTags.has(t)?'このタグを含むPCを表示（クリックで除外に切替）':(excludeTags.has(t)?'このタグを除外中（クリックで解除）':'クリックで絞り込み');
    return `<span class="tagchip ${cls}" data-tag="${esc(t)}" title="${tip}">${esc(t)}</span>`;
  }).join('');
}
/* タグ並び順（localStorageに保存） */
function getTagOrder(){ try{return JSON.parse(localStorage.getItem('coc_tag_order')||'[]');}catch(e){return [];} }
function setTagOrder(arr){ try{localStorage.setItem('coc_tag_order',JSON.stringify(arr));}catch(e){} }
function orderedTags(){
  const order=getTagOrder();
  const all=[...allTagsUnion()];
  all.sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1;
    if(ib!==-1)return 1;
    return a.localeCompare(b,'ja');
  });
  return all;
}
function sortTagsByOrder(arr){
  const order=getTagOrder();
  return [...(arr||[])].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1; if(ib!==-1)return 1;
    return a.localeCompare(b,'ja');
  });
}

function kanaNorm(furi){
  if(!furi)return '';
  let out='';
  for(const ch of String(furi).trim()){
    const code=ch.charCodeAt(0);
    out+=(code>=0x30A1&&code<=0x30F6)?String.fromCharCode(code-0x60):ch; // カタカナ→ひらがな
  }
  return out;
}

async function bulkApply(mutator, okMsg){
  const ids=[...selectedIds];
  if(ids.length===0){showToast('選択されていません');return;}
  let okc=0;
  for(const id of ids){
    try{
      const {data:row,error}=await db.from('character_sheets').select('data').eq('id',id).single();
      if(error)throw error;
      let s={};try{s=JSON.parse(row.data)||{};}catch(e){}
      mutator(s);
      const newData=JSON.stringify(s);
      const {error:e2}=await db.from('character_sheets').update({data:newData}).eq('id',id);
      if(e2)throw e2;
      const char=allChars.find(c=>c.id===id); if(char){char.data=newData;char._sheet=s;}
      okc++;
    }catch(e){console.warn('bulk err',id,e);}
  }
  buildTagFilter(); applyFilters(); showToast(okMsg.replace('{n}',okc));
}

function _dateStamp(){const d=new Date();const p=n=>String(n).padStart(2,'0');return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}
function _downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},150);}
function _csvCell(v){v=String(v==null?'':v);if(/[",\r\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';return v;}
async function exportJSON(){
  if(!allChars.length){showToast('データがありません');return;}
  if(typeof JSZip==='undefined'){showToast('ZIPライブラリを読み込めませんでした');return;}
  const zip=new JSZip();
  const used={};
  allChars.forEach(c=>{
    let obj={};
    try{obj=JSON.parse(c.data)||{};}catch(e){obj={};}
    const inp=obj.inputs||{};
    // タグを最新化
    const tags=charTags(c); if(tags.length)obj.tags=tags;
    // 特徴表を読みやすく明示（t1_sel/t2_sel は元データにも保持）
    const feats=[tokuchoLabel(inp.t1_sel),tokuchoLabel(inp.t2_sel)].filter(Boolean);
    if(feats.length)obj.feature_labels=feats;
    // ファイル名（PC名、使用不可文字を除去・重複回避）
    let name=((c.char_name||inp.pcname||'character')+'').trim()||'character';
    name=name.replace(/[\\/:*?"<>|\n\r\t]/g,'_');
    let fn=name, i=2; while(used[fn]){fn=name+'_'+i;i++;} used[fn]=1;
    zip.file(fn+'.json', JSON.stringify(obj,null,2));
  });
  try{
    const blob=await zip.generateAsync({type:'blob'});
    _downloadBlob(blob, 'coc_characters_'+_dateStamp()+'.zip');
    showToast(allChars.length+'件をZIP出力しました');
  }catch(e){ showToast('ZIP生成に失敗しました'); console.warn(e); }
}
// 全PCを閲覧モード画面のPDFにして一括ZIPダウンロード
async function exportAllPDF(){
  if(!allChars.length){showToast('データがありません');return;}
  if(typeof JSZip==='undefined'){showToast('ZIPライブラリを読み込めませんでした');return;}
  const zip=new JSZip();
  const used={};
  const iframe=document.createElement('iframe');
  iframe.style.cssText='position:fixed;width:900px;height:1400px;left:-4000px;top:0;border:0;visibility:hidden';
  document.body.appendChild(iframe);
  const loadView=(url)=>new Promise(res=>{ iframe.onload=()=>res(); iframe.src=url+'&_='+Date.now()+Math.random(); });
  const waitReady=()=>new Promise(res=>{ const t0=Date.now(); const chk=()=>{ try{const w=iframe.contentWindow; if(w&&w.__viewReady&&w.__makePDFBlob)return res(true);}catch(_){ } if(Date.now()-t0>30000)return res(false); setTimeout(chk,100); }; chk(); });
  let okc=0,errc=0;
  showToast('PDF生成中... (0/'+allChars.length+')');
  for(let i=0;i<allChars.length;i++){
    const c=allChars[i];
    try{
      await loadView(viewUrlFor(c.id));
      const ready=await waitReady();
      if(!ready){ errc++; showToast('PDF生成中... ('+(i+1)+'/'+allChars.length+')'); continue; }
      await new Promise(r=>setTimeout(r,450));        // 画像読込・レイアウト安定待ち
      const {blob,name}=await iframe.contentWindow.__makePDFBlob();
      let nm=((name||c.char_name||'character')+'').trim().replace(/[\\/:*?"<>|\n\r\t]/g,'_')||'character';
      let fn=nm,k=2; while(used[fn]){fn=nm+'_'+k;k++;} used[fn]=1;
      zip.file(fn+'.pdf', blob);
      okc++;
    }catch(e){ errc++; console.warn('pdf err',c.id,e); }
    showToast('PDF生成中... ('+(i+1)+'/'+allChars.length+')');
  }
  iframe.remove();
  try{
    const blob=await zip.generateAsync({type:'blob'});
    _downloadBlob(blob,'coc_pdf_'+_dateStamp()+'.zip');
    showToast('PDF一括出力：成功'+okc+'件'+(errc?('／失敗'+errc+'件'):''));
  }catch(e){ showToast('ZIP生成に失敗しました'); console.warn(e); }
}

    const row=[inp.pcname||c.char_name||'',inp.furigana||'',inp.job||'',inp.age||'',inp.gender||'',
      S_LABEL[inp.pc_status||'alive']||'',(charSan(c)==null?'':charSan(c)),
      ...AB.map(k=>inp[k]==null?'':inp[k]),
      (Array.isArray(s.tags)?s.tags.join(' '):'')];
    lines.push(row.map(_csvCell).join(','));
  });
  _downloadBlob(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv'}), 'coc_characters_'+_dateStamp()+'.csv');
  showToast(allChars.length+'件をCSV出力しました');
}

/* タグ編集（既存タグからも選択可能なモーダル） */
let _teId=null, _teSelected=new Set(), _teBulk=false;
function allTagsUnion(){const s=new Set();allChars.forEach(c=>charTags(c).forEach(t=>s.add(t)));return s;}
function editTags(id){
  const char=allChars.find(c=>c.id===id); if(!char)return;
  _teBulk=false; _teId=id; _teSelected=new Set(charTags(char));
  const t=document.getElementById('te_title'); if(t)t.textContent='タグを編集';
  const inp=document.getElementById('te_new'); if(inp)inp.value='';
  renderTeChips();
  document.getElementById('tag_editor_overlay').classList.add('on');
  if(inp)setTimeout(()=>inp.focus(),50);
}
function renderTeChips(){
  const wrap=document.getElementById('te_chips'); if(!wrap)return;
  const set=new Set([...allTagsUnion(), ...getTagOrder(), ..._teSelected]);
  if(set.size===0){wrap.innerHTML='<span class="te-empty">既存のタグはありません。下の欄から追加してください。</span>';return;}
  const order=getTagOrder();
  const all=[...set].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1; if(ib!==-1)return 1;
    return a.localeCompare(b,'ja');
  });
  wrap.innerHTML=all.map(t=>
    `<span class="te-chip ${_teSelected.has(t)?'on':''}" data-tag="${esc(t)}">${esc(t)}</span>`
  ).join('');
}
function teAddNew(){
  const inp=document.getElementById('te_new'); if(!inp)return;
  inp.value.split(',').map(t=>t.trim().replace(/["'\\]/g,'')).filter(Boolean).forEach(t=>_teSelected.add(t));
  inp.value=''; renderTeChips(); inp.focus();
}
function teSave(){
  const tags=[..._teSelected];
  if(_teBulk){
    if(tags.length>0){
      bulkApply(s=>{const cur=Array.isArray(s.tags)?s.tags:[];s.tags=[...new Set([...cur,...tags])].slice(0,20);}, '{n}件にタグを追加しました');
    }
    teClose(); return;
  }
  if(_teId==null)return;
  updateCharData(_teId, s=>{ s.tags=tags.slice(0,20); }, 'タグを更新しました');
  teClose();
}
function teClose(){ document.getElementById('tag_editor_overlay').classList.remove('on'); _teId=null; }

/* ===== タグの編集・並べ替え（全キャラ反映） ===== */
function openTagManage(){ renderTmList(); document.getElementById('tag_manage_overlay').classList.add('on'); }
function tmClose(){ document.getElementById('tag_manage_overlay').classList.remove('on'); }
function renderTmList(){
  const wrap=document.getElementById('tm_list'); if(!wrap)return;
  const order=getTagOrder();
  const set=new Set([...allTagsUnion(), ...order]);
  const tags=[...set].sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    if(ia!==-1&&ib!==-1)return ia-ib;
    if(ia!==-1)return -1; if(ib!==-1)return 1;
    return a.localeCompare(b,'ja');
  });
  if(tags.length===0){ wrap.innerHTML='<span class="te-empty">タグはまだありません。</span>'; return; }
  wrap.innerHTML=tags.map(t=>
    `<div class="tm-row" data-tag="${esc(t)}">
       <span class="tm-handle" onpointerdown="tmPointerDown(event,'${esc(t)}')" title="ドラッグで並べ替え">⠿</span>
       <input class="tm-name" value="${esc(t)}" data-orig="${esc(t)}" onchange="tmRename(this)">
       <button class="tm-btn tm-del" onclick="tmDelete('${esc(t)}')">✕</button>
     </div>`
  ).join('');
}
function tmAdd(){
  const inp=document.getElementById('tm_new'); if(!inp)return;
  const name=(inp.value||'').trim().replace(/["'\\]/g,'');
  if(!name){ inp.focus(); return; }
  const order=getTagOrder();
  if(new Set([...allTagsUnion(), ...order]).has(name)){ showToast('そのタグは既にあります'); inp.value=''; inp.focus(); return; }
  setTagOrder([...order, name]);
  inp.value='';
  renderTmList(); buildTagFilter();
  showToast('タグ「'+name+'」を追加しました');
  inp.focus();
}
let _tmDragEl=null;
function tmPointerDown(e,tag){
  e.preventDefault();
  _tmDragEl=e.target.closest('.tm-row');
  if(!_tmDragEl)return;
  _tmDragEl.classList.add('dragging');
  try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener('pointermove',tmPointerMove);
  window.addEventListener('pointerup',tmPointerUp,{once:true});
}
function tmPointerMove(e){
  const list=document.getElementById('tm_list'); if(!list||!_tmDragEl)return;
  const rows=[...list.querySelectorAll('.tm-row')];
  const y=e.clientY;
  let target=null;
  for(const r of rows){ if(r===_tmDragEl)continue; const rect=r.getBoundingClientRect(); if(y<rect.top+rect.height/2){ target=r; break; } }
  if(target){ if(target!==_tmDragEl.nextSibling) list.insertBefore(_tmDragEl,target); }
  else { list.appendChild(_tmDragEl); }
}
function tmPointerUp(){
  window.removeEventListener('pointermove',tmPointerMove);
  if(_tmDragEl)_tmDragEl.classList.remove('dragging');
  const list=document.getElementById('tm_list');
  if(list){ const order=[...list.querySelectorAll('.tm-row')].map(r=>r.dataset.tag); setTagOrder(order); buildTagFilter(); }
  _tmDragEl=null;
}
async function _tagApplyAll(mutator){
  for(const c of allChars){
    try{
      const {data:row,error}=await db.from('character_sheets').select('data').eq('id',c.id).single();
      if(error)continue;
      let s={};try{s=JSON.parse(row.data)||{};}catch(e){}
      const before=JSON.stringify(s.tags||[]);
      mutator(s);
      if(JSON.stringify(s.tags||[])===before)continue; // 変化なしはスキップ
      const nd=JSON.stringify(s);
      await db.from('character_sheets').update({data:nd}).eq('id',c.id);
      c.data=nd; c._sheet=s;
    }catch(e){console.warn('tag apply err',c.id,e);}
  }
  applyFilters();
}
async function tmRename(inp){
  const orig=inp.dataset.orig;
  const next=(inp.value||'').trim().replace(/["'\\]/g,'');
  if(!next||next===orig){ inp.value=orig; return; }
  await _tagApplyAll(s=>{ if(Array.isArray(s.tags)) s.tags=[...new Set(s.tags.map(t=>t===orig?next:t))]; });
  setTagOrder([...new Set(getTagOrder().map(t=>t===orig?next:t))]);
  buildTagFilter(); renderTmList(); showToast('タグ名を変更しました');
}
async function tmDelete(tag){
  if(!confirm('タグ「'+tag+'」を全キャラから削除しますか？'))return;
  await _tagApplyAll(s=>{ if(Array.isArray(s.tags)) s.tags=s.tags.filter(t=>t!==tag); });
  setTagOrder(getTagOrder().filter(t=>t!==tag));
  buildTagFilter(); renderTmList(); showToast('タグを削除しました');
}

async function updateCharData(id, mutator, okMsg){
  try{
    const {data:row,error}=await db.from('character_sheets').select('data').eq('id',id).single();
    if(error)throw error;
    let s={};try{s=JSON.parse(row.data)||{};}catch(e){}

    buildTagFilter();applyFilters();
    showToast(okMsg||'更新しました');

}

/* ===== スプレッドシートHTML 一括取込（新規キャラとして追加） ===== */
function bulkImportSpreadsheets(){
  const input=document.createElement('input');
  input.type='file'; input.accept='.html,.htm'; input.multiple=true;
  input.onchange=async e=>{
    const files=[...e.target.files]; if(!files.length)return;
    if(!confirm(files.length+'件のHTMLを新規キャラとして取り込みます。よろしいですか？'))return;
    showToast('取込中... (0/'+files.length+')');
    let okc=0, errc=0;
    const iframe=document.createElement('iframe');
    iframe.style.cssText='position:fixed;width:1200px;height:900px;left:-3000px;top:0;border:0;visibility:hidden';
    document.body.appendChild(iframe);
    const loadIframe=()=>new Promise(res=>{ iframe.onload=()=>res(); iframe.src='sheet.html?bulkimport=1&_='+Date.now()+Math.random(); });
    const waitReady=()=>new Promise(res=>{
      const t0=Date.now();
      const chk=()=>{
        try{ const w=iframe.contentWindow; if(w&&w.__bulkReady&&w.parseSpreadsheetHTML&&w.collectData)return res(true);}catch(_){}
        if(Date.now()-t0>20000)return res(false);
        setTimeout(chk,80);
      };
      chk();
    });
    try{
      const {data:{user}}=await db.auth.getUser();
      if(!user){showToast('ログインが必要です');iframe.remove();return;}
      for(let i=0;i<files.length;i++){
        const f=files[i];
        let text=''; try{ text=await f.text(); }catch(_){ errc++; continue; }
        await loadIframe();                 // ファイルごとに再読込してキャリーオーバー防止
        const ready=await waitReady();
        if(!ready){ errc++; continue; }
        try{
          iframe.contentWindow.alert=()=>{};            // 取込完了アラートを抑制
          iframe.contentWindow.parseSpreadsheetHTML(text);
          await new Promise(r=>setTimeout(r,120));        // 行追加等の反映待ち
          const dataStr=iframe.contentWindow.collectData();
          let pcname='名無し';
          try{ pcname=(JSON.parse(dataStr).inputs||{}).pcname||'名無し'; }catch(_){}
          const {error}=await db.from('character_sheets').insert({user_id:user.id,char_name:pcname,data:dataStr});
          if(error){ errc++; console.warn('insert err',f.name,error); } else okc++;
        }catch(err){ errc++; console.warn('parse err',f.name,err); }
        showToast('取込中... ('+(i+1)+'/'+files.length+')');
      }
    }catch(e){ console.warn(e); }
    iframe.remove();
    await loadList();
    showToast('取込完了：成功'+okc+'件'+(errc?('／失敗'+errc+'件'):''));
  };
  input.click();

// 表示モード（list=従来 / ark=アークナイツ風）
let viewMode = (function(){ try{return localStorage.getItem('coc_view_mode')||'list';}catch(e){return 'list';} })();
// 職業（クラス）絞り込みの選択肢：先鋒,前衛,重装,狙撃,術師,医療,補助,特殊（値はark_class）
const ARK_ORDER=[4,5,2,6,3,1,8,7];
(function(){
  const fill=()=>{
    const f2=(id,arr)=>{ const el=document.getElementById(id); if(!el||el.options.length)return; el.innerHTML='<option value="">すべて</option>'+arr.map((x,i)=>'<option value="'+(i+1)+'">'+x.n+'</option>').join('')+'<option value="none">未設定</option>'; };
    f2('elem_filter',HSR_ELEMS); f2('path_filter',HSR_PATHS);
    const sel=document.getElementById('cls_filter'); if(!sel||sel.options.length)return;
    sel.innerHTML='<option value="">すべて</option>'+ARK_ORDER.map(v=>'<option value="'+v+'">'+ARK_ICONS[v-1].n+'</option>').join('')+'<option value="none">未設定</option>'; };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',fill); else fill();
})();
function _updVmIcon(){
  // 職業絞り込みはアーク風表示のときだけ出す
  document.querySelectorAll('.ark-only').forEach(el=>el.style.display=(viewMode==='ark')?'':'none');
  document.querySelectorAll('.hsr-only').forEach(el=>el.style.display=(viewMode==='hsr')?'':'none');
  const b=document.getElementById('vm_toggle'); if(!b)return;
  // 現在の表示モードを示すアイコン（タップで切替）
  // 次に切り替わる表示のアイコン（リスト→アーク風→スタレ風→リスト）
  const nx={list:['🎴','アーク風表示に切替'],ark:['🌌','スタレ風表示に切替'],hsr:['📋','リスト表示に切替']}[viewMode]||['🎴','アーク風表示に切替'];
  b.textContent=nx[0]; b.title=nx[1];
}
function setViewMode(m){
  viewMode=m;
  try{ localStorage.setItem('coc_view_mode',m); }catch(e){}
  _updVmIcon();
  applyFilters();
}
function toggleViewMode(){ setViewMode(viewMode==='list'?'ark':viewMode==='ark'?'hsr':'list'); }
// アーク風表示時：マウスホイールの縦回転を横スクロールに変換
(function(){
  function bindWheel(){
    const g=document.getElementById('grid'); if(!g||g._arkWheel)return; g._arkWheel=1;
    g.addEventListener('wheel',function(e){
      if(!g.classList.contains('grid-ark'))return;
      const d = Math.abs(e.deltaY)>=Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if(!d)return;
      e.preventDefault();
      g.scrollLeft += d;
    }, {passive:false});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bindWheel);
  else bindWheel();
})();
function renderCards(chars){
  const grid=document.getElementById('grid');
  // 既存カード・見出しを削除（loading/empty/no_result以外）
  [...grid.querySelectorAll('.card, .group-head, .ark-card, .hsr-card')].forEach(el=>el.remove());
  grid.classList.toggle('grid-ark', viewMode==='ark');
  grid.classList.toggle('grid-hsr', viewMode==='hsr');
  _updVmIcon();

  document.getElementById('empty').style.display='none';
  document.getElementById('no_result').style.display='none';
  document.getElementById('loading').style.display='none';

  if(chars.length===0){
    document.getElementById(allChars.length===0?'empty':'no_result').style.display='block';
    const hint0=document.getElementById('search_hint'); if(hint0)hint0.textContent='0件 / '+allChars.length+'件';
    return;
  }

  if(viewMode==='ark'){
    chars.forEach(char=>grid.appendChild(makeArkCard(char)));
    requestAnimationFrame(_fitArkNames);
  } else if(viewMode==='hsr'){
    chars.forEach(char=>grid.appendChild(makeHsrCard(char)));
    requestAnimationFrame(_fitHsrRows);
  } else {
    let lastHead=null;
    chars.forEach(char=>{
      if(sortKey==='furigana'){
        const hd=kanaHead((getSheet(char).inputs||{}).furigana);
        if(hd!==lastHead){
          const h=document.createElement('div');h.className='group-head';h.textContent=hd;
          grid.appendChild(h);lastHead=hd;
        }
      }
      grid.appendChild(makeCard(char));
    });
    // カードの高さに合わせて画像を正方形にする
    requestAnimationFrame(()=>{
      grid.querySelectorAll('.card-icon').forEach(icon=>{
        const h=icon.offsetHeight||56;
        icon.style.width=h+'px';
        icon.style.flexShrink='0';
      });
    });
  }

  // 件数表示
  const hint=document.getElementById('search_hint');
  hint.textContent = (chars.length!==allChars.length)?`${chars.length}件 / ${allChars.length}件`:`${allChars.length}件`;
}
// アークナイツ風カード
function makeArkCard(char){
  let sheet={};try{sheet=JSON.parse(char.data);}catch(e){}
  char._sheet=sheet;
  const inp=sheet.inputs||{};
  const pcname=inp.pcname||char.char_name||'名無し';
  const status=inp.pc_status||'alive';
  const sanNow=inp.san_now||(parseInt(inp.pow||0)*5)||'?';
  const charImage=inp.charImage||'';
  const fixedImg=charImage?fixDropboxUrlIndex(charImage):'';
  const pos=(inp.charImagePos||'50% 30%').split(' ');
  const ox=parseFloat(pos[0])||50, oy=parseFloat(pos[1]||pos[0])||30;
  const bgSize=Math.round((inp.charImageScale||1.3)*100)+'%';
  const imgHtml=fixedImg
    ? `<div class="ark-img" style="background-image:url('${esc(fixedImg)}');background-size:${bgSize};background-position:${ox}% ${oy}%"></div>`
    : `<div class="ark-noimg">${esc(pcname.charAt(0)||'?')}</div>`;
  const stColor={alive:'#1a7a45',lost:'#b03030',permalost:'#7a1111',retired:'#3a5a8a',missing:'#8a6000',dead:'#5e2b9e',insane:'#6a1a9a'}[status]||'#555';
  // SAN割合（99で満円）
  const sanPct=Math.max(0,Math.min(100,(parseInt(sanNow)||0)/99*100));
  // クラスアイコン（シートのアーク風設定）
  const clsI=parseInt(inp.ark_class)||0;
  const clsHtml=(clsI>=1&&clsI<=ARK_ICONS.length)?`<div class="ark-cls" title="${ARK_ICONS[clsI-1].n}（タップでアーク風閲覧URLをコピーして開く）" onclick="event.stopPropagation();copyArkUrl('${char.id}')"><img src="${ARK_ICONS[clsI-1].s}" alt=""></div>`:'';
  const card=document.createElement('div');
  card.className='ark-card';
  card.dataset.id=char.id;
  card.innerHTML=
    imgHtml+clsHtml+
    `<span class="ark-status-dot" style="background:${stColor}">${S_LABEL[status]||''}</span>`+
    `<div class="ark-overlay">`+
      `<div class="ark-botrow">`+
        `<div class="ark-san" style="--p:${sanPct.toFixed(1)}"><span class="lab">SAN</span><span class="val">${esc(String(sanNow))}</span></div>`+
        `<div class="ark-acts">`+
          `<button class="ark-act" title="駒出力" onclick="event.stopPropagation();openCocoFromIndex('${char.id}')">🐔</button>`+
          `<button class="ark-act" title="閲覧URLをコピー" onclick="event.stopPropagation();copyViewUrl('${char.id}')">🔗</button>`+
        `</div>`+
      `</div>`+
      `<div class="ark-name" title="${esc(pcname)}">${esc(pcname)}</div>`+
    `</div>`;
  // アイコン（カード本体）タップで編集へ
  card.addEventListener('click',()=>openEdit(char.id));
  return card;
}

function makeHsrCard(char){
  const sheet=getSheet(char); char._sheet=sheet;
  const inp=sheet.inputs||{};
  const pcname=inp.pcname||char.char_name||'名無し';
  const sanNow=inp.san_now||(parseInt(inp.pow||0)*5)||'?';
  const img=inp.charImage?fixDropboxUrlIndex(inp.charImage):'';
  const pos=(inp.charImagePos||'50% 30%').split(' ');
  const ox=parseFloat(pos[0])||50, oy=parseFloat(pos[1]||pos[0])||30;
  const bgSize=Math.round((parseFloat(inp.charImageScale)||1.3)*100)+'%';
  const el=parseInt(inp.hsr_elem)||0, pa=parseInt(inp.hsr_path)||0;
  const ic=(arr,i,act)=>(i>=1&&i<=arr.length)?`<span class="hsr-ic${act?' hsr-ic-act':''}" title="${arr[i-1].n}${act?'（タップでスタレ風閲覧URLをコピーして開く）':''}"${act?` onclick="event.stopPropagation();copyArkUrl('${char.id}','hsr')"`:''}><img src="${arr[i-1].s}" alt=""></span>`:'';
  const tk=[tokuchoLabel(inp.t1_sel),tokuchoLabel(inp.t2_sel)].filter(x=>x).map(x=>x.replace(/^（[^）]*）/,''));
  const card=document.createElement('div');
  card.className='hsr-card'; card.dataset.id=char.id;
  card.innerHTML=
    `<div class="hsr-pic">`+
      (img?`<div class="hsr-img" style="background-image:url('${esc(img)}');background-size:${bgSize};background-position:${ox}% ${oy}%"></div>`:`<div class="hsr-noimg">${esc(pcname.charAt(0)||'?')}</div>`)+
      `<div class="hsr-icons">${ic(HSR_ELEMS,el,true)}${ic(HSR_PATHS,pa)}</div>`+
      `<div class="hsr-name">${esc(pcname)}</div>`+
    `</div>`+
    `<div class="hsr-info">`+
      `<div class="hsr-top"><div class="hsr-lv"><span>SAN</span>${esc(String(sanNow))}</div>${inp.age?`<div class="hsr-age">${esc(inp.age)}歳</div>`:''}</div>`+
      `<div class="hsr-box">`+
        (inp.job?`<div class="hsr-row">${esc(inp.job)}</div>`:'')+
        tk.map(t=>`<div class="hsr-row hsr-tk">${esc(t)}</div>`).join('')+
      `</div>`+
    `</div>`;
  card.addEventListener('click',()=>openEdit(char.id));
  return card;
}

function tokuchoLabel(v){
  if(v===""||v==null)return "";
  if(v==="ng")return "（×）採用不可";
  const i=parseInt(v,10);
  return (Number.isInteger(i)&&tokuchoLabels[i])?tokuchoLabels[i]:"";
}

function makeCard(char){
  let sheet={};try{sheet=JSON.parse(char.data);}catch(e){}
  char._sheet=sheet;
  const inp=sheet.inputs||{};
  const tags=sortTagsByOrder(Array.isArray(sheet.tags)?sheet.tags:[]);

  const pcname  =inp.pcname   ||char.char_name||'名無し';
  const furigana=inp.furigana ||'';
  const job     =inp.job      ||'';
  const age     =inp.age      ||'';
  const gender  =inp.gender   ||'';
  const status  =inp.pc_status||'alive';
  const color   =inp.txtcolor ||'#888888';
  const charImage = inp.charImage||'';
  const charImagePos = inp.charImagePos||'50% 30%';
  const charImageScale = inp.charImageScale||1.3;

  // 現在SAN
  const sanNow=inp.san_now||(parseInt(inp.pow||0)*5)||'?';

  // 特徴表①②（番号→特徴名に変換）
  const t1Label=tokuchoLabel(inp.t1_sel);
  const t2Label=tokuchoLabel(inp.t2_sel);

  // 更新日 YY/MM/DD
  const d=new Date(char.updated_at);
  const updDate=`${String(d.getFullYear()).slice(2)}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;

  // メタ行
  const metaParts=[];
  if(age)metaParts.push({label:'年齢：',value:age});
  if(gender)metaParts.push({label:'性別：',value:gender});
  metaParts.push({label:'SAN：',value:String(sanNow)});

  // アイコン画像HTML
  const fixedImg = charImage ? fixDropboxUrlIndex(charImage) : '';
  const pos = (charImagePos||'50% 30%').split(' ');
  const ox = parseFloat(pos[0])||50;
  const oy = parseFloat(pos[1]||pos[0])||30;
  const bgSize = Math.round(charImageScale * 100) + '%';
  const bgPos = ox + '% ' + oy + '%';
  const iconHtml = fixedImg
    ? `<div class="card-icon" style="background-image:url('${esc(fixedImg)}');background-size:${bgSize};background-position:${bgPos};background-repeat:no-repeat"></div>`
    : `<div class="card-icon" style="background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--text-muted)">${esc(pcname.charAt(0)||'?')}</div>`;

  const card=document.createElement('div');
  card.className='card'+(selectedIds.has(char.id)?' sel':'');
  card.dataset.id=char.id;
  card.innerHTML=`
    <input type="checkbox" class="card-check" ${selectedIds.has(char.id)?'checked':''}>`+`
    <div class="card-top">
      <div class="card-bar" style="background:${esc(color)}"></div>
      ${iconHtml}
      <div class="card-info">
        <div class="card-tag-row">
          <span class="card-furigana">${esc(furigana)}</span>
          <span class="badge ${S_CLS[status]||'s-alive'}" data-id="${char.id}" title="タップで状態変更">${S_LABEL[status]||status}</span>
        </div>
        <div class="card-pcname">${esc(pcname)}</div>
        ${job?`<div class="card-job">${esc(job)}</div>`:'<div class="card-job" style="color:#ccc">（職業未設定）</div>'}
        <div class="card-meta">${metaParts.map(p=>`<span class="meta-label">${esc(p.label)}</span><span class="meta-value">${esc(p.value)}</span>`).join('')}</div>
        ${(t1Label||t2Label)?`<div class="card-tokucho">${t1Label?`<span class="meta-value">${esc(t1Label)}</span>`:''}${t2Label?`<span class="meta-value">${esc(t2Label)}</span>`:''}</div>`:''}
      </div>
    </div>
    <div class="card-foot">
      <div class="card-tags card-tags-foot">${tags.map(t=>`<span class="card-tag">${esc(t)}</span>`).join('')}<span class="card-tag-edit" data-id="${char.id}">🏷 タグ</span></div>
      <button class="cbtn" style="background:#2a7a4a;color:#fff" onclick="openEdit('${char.id}')">✏️ 編集</button>
      <button class="cbtn" style="background:#553388;color:#fff" onclick="openCocoFromIndex('${char.id}')">🐔 出力</button>
      <button class="cbtn" style="background:#2a6a8a;color:#fff" onclick="copyViewUrl('${char.id}')" title="閲覧URLをコピー">🔗</button>
    </div>`;
  return card;
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fixDropboxUrlIndex(url) {
  if (!url) return '';
  if (url.includes('dropbox.com')) {
    let u = url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('dropbox.com','dl.dropboxusercontent.com');
    u=u.replace(/([?&])dl=[01]/,'$1raw=1');
    if(!/[?&]raw=1/.test(u))u+=(u.includes('?')?'&':'?')+'raw=1';
    return u;
  }
  return url;
}
// いあきゃら(iaproject.app)のURLは画像直リンク形式 https://image.iaproject.app/<uuid> に変換（ココフォリアで画像表示できるように）
function toIaprojectImageUrl(url){
  if(!url) return url;
  if(/iaproject\.app/i.test(url)){
    const m=url.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if(m) return 'https://image.iaproject.app/'+m[0];
  }
  return url;
}

function openEdit(id){
  sessionStorage.setItem('coc_load_id',id);
  location.href='sheet.html?id='+id;
}
function viewUrlFor(id){
  const char=allChars.find(c=>c.id===id);
  const rev=char?getSheet(char).share_rev:'';
  let u='view.html?id='+id;
  if(rev)u+='&r='+encodeURIComponent(rev);
  return u;
}
function openView(id){
  location.href=viewUrlFor(id);
}

async function deleteChar(id,btn){
  if(!confirm('このキャラクターを削除しますか？\n（この操作は元に戻せません）'))return;
  try{
    await db.from('character_sheets').delete().eq('id',id);
    btn.closest('.card').remove();
    allChars=allChars.filter(c=>c.id!==id);
    if(document.querySelectorAll('#grid .card').length===0)
      document.getElementById(allChars.length===0?'empty':'no_result').style.display='block';
    const hint=document.getElementById('search_hint');
    hint.textContent=allChars.length+'件';
  }catch(e){alert('削除エラー: '+e.message);}
}

const THEME_KEY = 'coc_theme';

function applyTheme(mode){

  const ver = localStorage.getItem(THEME_KEY+'_ver');

  applyTheme(saved);
})();

const _SKILLS_DEF = {
  combat:[

  ],

    {n:'電子工学',b:1,k:'denshi'},{n:'天文学',b:1,k:'tenmon'},{n:'博物学',b:10,k:'hakubutsu'},
    {n:'物理学',b:1,k:'butsuri'},{n:'法律',b:5,k:'law'},{n:'薬学',b:1,k:'yakugaku'},
    {n:'歴史',b:20,k:'rekishi'},
  ],
};

const _MELEE = {kick:'1D6{DB}',kumi:'特殊',punch:'1D3{DB}',atama:'1D4{DB}',ma:'1D3{DB}'};
const _GUN_KEYS = ['gun','smg','sg','mg','rifle'];
const _MA_COMBO = ['kick','punch','atama','kumi'];

function _getCocoStats(inp) {
  const n = k => parseInt(inp[k]||0)||0;
  const str=n('str')+n('str_m')+n('str_t');
  const con=n('con')+n('con_m')+n('con_t');
  const pow=n('pow')+n('pow_m')+n('pow_t');
  const dex=n('dex')+n('dex_m')+n('dex_t');
  const app=n('app')+n('app_m')+n('app_t');
  const siz=n('siz')+n('siz_m')+n('siz_t');
  const int_c=n('int_v')+n('int_m')+n('int_t');
  const edu=n('edu')+n('edu_m')+n('edu_t');
  return {str,con,pow,dex,app,siz,int_c,edu};
}

function _getSkillBase(def, stats) {
  if (def.dyn === 'dex2') return stats.dex * 2;
  if (def.dyn === 'edu5') return stats.edu * 5;
  return def.b || 0;
}

function _getSkillTotal(key, skills, stats) {
  const s = skills.find(x => x.key === key);
  if (!s) return 0;
  const base = (() => {
    for (const cat of Object.values(_SKILLS_DEF)) {
      const d = cat.find(x => x.k === key);
      if (d) return _getSkillBase(d, stats);
    }
    return 0;
  })();
  return base + (parseInt(s.job)||0) + (parseInt(s.int)||0) + (parseInt(s.grw)||0) + (parseInt(s.oth)||0);
}

function _getGunJamNo(total) {
  if (total >= 86) return 100;
  if (total >= 76) return 99;
  if (total >= 51) return 98;
  return 97;
}

function _buildChatPalette(sheet) {
  const inp = sheet.inputs || {};
  const skills = sheet.skills || [];
  const stats = _getCocoStats(inp);
  const weapons = sheet.weapons || [];
  const weaponNames = new Set();
  weapons.forEach(w => { const v=Array.isArray(w)?w:(w.vals||[]); const n=(v[0]||'').trim(); if(n) weaponNames.add(n); });
  const lines = [];

  lines.push('〇');
  lines.push(':SAN.max={SAN}');
  lines.push(':SAN');
  lines.push(':HP');
  lines.push(':MP');
  lines.push(`CCB<={SAN} 【SANチェック】`);
  lines.push(`CCB<=${stats.int_c*5} 【アイデア】`);
  lines.push(`CCB<=${stats.pow*5} 【幸運】`);
  lines.push(`CCB<=${stats.edu*5} 【知識】`);

  const maTotal = _getSkillTotal('ma', skills, stats);
  const maBase = stats.edu; // dummy, ma base=1
  const alwaysKeys = new Set(['kaihi','firstaid']);
  const comboAdded = new Set();
  const _customDone = new Set();

  const sectionOrder = ['combat', null, 'search', 'action', 'talk', 'know'];

  sectionOrder.forEach(sec => {
    if (sec === null) {
      // 武器テーブル
      weapons.forEach(w => {
        const vals = Array.isArray(w) ? w : (w.vals || []);
        const db = typeof w === 'object' && !Array.isArray(w) ? (w.db || false) : false;
        const wName = vals[0]; const wPct = parseInt(vals[1])||0;
        const wDmg = vals[2];
        if (!wName || !wPct) return;
        lines.push(`CCB<=${wPct} 【${wName}】`);
        if (wDmg) lines.push(`${db ? wDmg+'{DB}' : wDmg} 【${wName}】ダメージ`);
      });
      return;
    }

    const defs = _SKILLS_DEF[sec] || [];
    defs.forEach(def => {
      const key = def.k;
      const base = _getSkillBase(def, stats);
      const total = _getSkillTotal(key, skills, stats);
      if (total <= base && !alwaysKeys.has(key)) return;

      const sk = skills.find(x => x.key === key);
      const label = (sk && sk.freeVal) ? def.n + '(' + sk.freeVal + ')' : def.n;
      if (weaponNames.has(label)) return; // 武器と重複する技能表の技能は出さない（武器側を優先）
      const isGun = _GUN_KEYS.includes(key);
      const isMelee = key in _MELEE;
      const isMa = key === 'ma';

      if (isGun && total > base) {
        const jamNo = _getGunJamNo(total);
        lines.push(`CCB(${jamNo})<=${total} 【${label}】`);
      } else {
        lines.push(`CCB<=${total} 【${label}】`);
      }

      if (key === 'firstaid') lines.push(`1D3 【応急手当】回復`);
      if (sec === 'combat' && isMelee && total > base) {
        const dmg = _MELEE[key];
        if (dmg && dmg !== '特殊') lines.push(`${dmg} 【${label}】ダメージ`);
      }
      if (isMa && total > base) lines.push(`1D3{DB} 【武道(MA)】ダメージ`);
      if (maTotal > 1 && _MA_COMBO.includes(key) && total > base) {
        const ck = `ma_${key}`;
        if (!comboAdded.has(ck)) {
          comboAdded.add(ck);
          lines.push(`CBRB(${maTotal},${total}) 【武道(MA)】+【${label}】`);
          lines.push(`2D6{DB} 【武道(MA)】+【${label}】ダメージ`);
        }
      }
    });

    // このセクションに属するカスタム追加技能をセクション末尾に出力（sheetと同じ並び）
    skills.forEach(s => {
      if (!s.key || !s.key.startsWith('custom_')) return;
      if ((s.tbodyId || '') !== 'tbody_' + sec) return;
      const name = (s.freeVal || '').trim();
      if (!name) return;
      if (weaponNames.has(name)) return;
      const base = parseInt(s.base) || 0;
      const total = base + (parseInt(s.job)||0) + (parseInt(s.int)||0) + (parseInt(s.grw)||0) + (parseInt(s.oth)||0);
      _customDone.add(s.key);
      if (total <= base) return;
      lines.push(`CCB<=${total} 【${name}】`);
    });
  });

  // 所属セクション不明（旧データ等）のカスタム技能は末尾に出力（保険）
  skills.forEach(s => {
    if (!s.key || !s.key.startsWith('custom_') || _customDone.has(s.key)) return;
    const name = (s.freeVal || '').trim();
    if (!name) return; // 名前未入力はスキップ
    if (weaponNames.has(name)) return; // 武器と重複する技能は出さない
    const base = parseInt(s.base) || 0;
    const total = base + (parseInt(s.job)||0) + (parseInt(s.int)||0) + (parseInt(s.grw)||0) + (parseInt(s.oth)||0);
    if (total <= base) return; // 初期値超えのみ出力
    lines.push(`CCB<=${total} 【${name}】`);
  });

  lines.push(`CCB<={STR}*5 【STR】`);
  lines.push(`CCB<={CON}*5 【CON】`);
  lines.push(`CCB<={POW}*5 【POW】`);
  lines.push(`CCB<={DEX}*5 【DEX】`);
  lines.push(`CCB<={APP}*5 【APP】`);
  lines.push(`CCB<={SIZ}*5 【SIZ】`);
  lines.push(`CCB<={INT}*5 【INT】`);
  lines.push(`CCB<={EDU}*5 【EDU】`);

  return lines.join('\n');
}

function _buildCocoJSON(sheet) {
  const inp = sheet.inputs || {};
  const stats = _getCocoStats(inp);
  const pcname = inp.pcname || 'キャラクター';
  const txtcolor = inp.txtcolor || '#000000';
  const san_now = parseInt(inp.san_now)||0;
  const max_san = san_now; // コマ出力は現在SAN＝最大SAN
  const hp = Math.ceil((stats.con + stats.siz) / 2);
  const mp = stats.pow;
  const iconUrl = inp.charImage ? toIaprojectImageUrl(fixDropboxUrlIndex(inp.charImage)) : '';

  return {
    kind: 'character',
    formatVersion: 1,
    data: {
      name: pcname,
      initiative: stats.dex,
      externalUrl: '',
      iconUrl: iconUrl,
      status: [
        {label:'HP', value: hp, max: hp},
        {label:'MP', value: mp, max: mp},
        {label:'SAN', value: san_now, max: max_san},
      ],
      params: [
        {label:'STR',value:String(stats.str)},{label:'CON',value:String(stats.con)},
        {label:'POW',value:String(stats.pow)},{label:'DEX',value:String(stats.dex)},
        {label:'APP',value:String(stats.app)},{label:'SIZ',value:String(stats.siz)},
        {label:'INT',value:String(stats.int_c)},{label:'EDU',value:String(stats.edu)},
        {label:'DB',value:(()=>{const ss=stats.str+stats.siz;return ss<=12?'-1D6':ss<=16?'-1D4':ss<=24?'0':ss<=32?'+1D4':ss<=40?'+1D6':'+2D6';})()},
      ],
      commands: _buildChatPalette(sheet),
      memo: '',
      secret: false,
      color: txtcolor || '#000000',
    }
  };
}

async function openCocoFromIndex(id) {
  const { data, error } = await db.from('character_sheets').select('data').eq('id', id).single();
  if (error || !data) { alert('データが見つかりません'); return; }
  _cocoSheet = JSON.parse(data.data);

  const palette = _buildChatPalette(_cocoSheet);
  const old = document.getElementById('cocofolia_modal');
  if (old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'cocofolia_modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:flex;align-items:center;justify-content:center';
  modal.innerHTML = `
    <div id="cocofolia_dialog" style="background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:12px;width:min(480px,92vw);box-shadow:0 4px 20px rgba(0,0,0,.5)">
    <div style="font-weight:bold;font-size:12px;color:var(--text);margin-bottom:6px">🐔 駒出力 - ${(_cocoSheet.inputs?.pcname||'')}</div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">📝 チャットパレット（プレビュー・編集可）</div>
    <textarea id="coco_palette_preview" style="width:100%;height:220px;font-size:11px;font-family:monospace;border:1px solid var(--border);padding:4px;resize:vertical;background:var(--surface2);color:var(--text)">${palette}</textarea>
    <div id="coco_copy_msg" style="font-size:11px;color:#2a7;display:none;margin:6px 0">✓ クリップボードにコピーしました！</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:11px;color:var(--text)">
      <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
        <input type="checkbox" id="coco_secret_check" style="width:14px;height:14px;cursor:pointer">
        非公開（secret）にする
      </label>
    </div>
    <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">
      <button onclick="document.getElementById('cocofolia_modal').remove()" style="font-size:11px;padding:3px 12px;cursor:pointer;background:#aaa;color:#fff;border:none;border-radius:2px">閉じる</button>
      <button onclick="_doCocoCopy()" style="font-size:11px;padding:3px 16px;cursor:pointer;background:#7755aa;color:#fff;border:none;border-radius:2px;font-weight:bold">📋 コマJSONをコピー</button>
    </div>
    </div>`;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function _doCocoCopy() {
  if (!_cocoSheet) return;
  const palette = document.getElementById('coco_palette_preview')?.value || _buildChatPalette(_cocoSheet);
  const json = _buildCocoJSON(_cocoSheet);
  json.data.commands = palette;
  json.data.secret = document.getElementById('coco_secret_check')?.checked || false;
  navigator.clipboard.writeText(JSON.stringify(json, null, 2)).then(() => {
    const msg=document.getElementById('coco_copy_msg');
    if(msg){msg.style.display='block';setTimeout(()=>msg.style.display='none',3000);}
  }).catch(() => alert('コピーに失敗しました'));
}
