<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a1c">
<title>キャラクター詳細</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Jost:wght@300;400;500&display=swap');
:root{--gold:#e7c58a;--txt:#f1eef8;--sub:#b9b3cc;--line:rgba(255,255,255,.18);--ui:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif;--num:'Jost',sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0b0a1c;color:var(--txt);font-family:var(--ui);overscroll-behavior:none;overflow:hidden}
#app{position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;overflow:clip}
html.rot #app{position:fixed;top:0;left:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
/* 宇宙背景 */
#bg{position:absolute;inset:0;background:
  radial-gradient(ellipse 60% 45% at 30% 30%,rgba(120,80,200,.35),transparent 70%),
  radial-gradient(ellipse 50% 40% at 75% 25%,rgba(70,90,200,.30),transparent 70%),
  radial-gradient(ellipse 80% 60% at 50% 60%,rgba(60,40,120,.45),transparent 75%),
  linear-gradient(#0d0b22,#151233 55%,#0b0a1c)}
#stars{position:absolute;inset:0;width:100%;height:100%}
#floor{position:absolute;left:-10%;right:-10%;bottom:-38%;height:62%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 38%,rgba(225,225,255,.9) 0%,rgba(170,170,235,.45) 22%,rgba(90,80,160,.25) 45%,rgba(20,18,45,.9) 70%);
  box-shadow:0 -6px 40px rgba(200,200,255,.35)}
#floor::before,#floor::after{content:'';position:absolute;left:28%;right:28%;top:12%;height:22%;border-radius:50%;border:1px solid rgba(255,255,255,.35)}
#floor::after{left:18%;right:18%;top:4%;height:40%;border-color:rgba(255,255,255,.18)}
/* 立ち絵 */
#stage{position:absolute;inset:0;container-type:size;pointer-events:none}
#stage img.full{position:absolute;left:50%;bottom:9%;height:84%;max-width:52%;object-fit:contain;object-position:center bottom;transform:translateX(-50%);filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
#stage img.crop{position:absolute;left:calc(50% + var(--x,0)*1cqh);top:calc(50% + var(--y,0)*1cqh);height:calc(var(--z,100)*1cqh);width:auto;max-width:none;transform:translate(-50%,-50%)}
#stage .noimg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30vh;color:rgba(255,255,255,.08);font-weight:700}
/* 左上ヘッダー */
#hdr{position:absolute;left:26px;top:16px;display:flex;align-items:center;gap:10px;z-index:5}
#hdr .hic{width:38px;height:38px;border-radius:50%;background-color:rgba(231,197,138,.18);background-repeat:no-repeat;border:1px solid rgba(231,197,138,.6);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:16px;color:var(--gold)}
#hdr .hic img{width:72%;height:72%;object-fit:contain}
#hdr .hic.hic-path{background-color:transparent}
#hdr .t1{font-size:11px;color:var(--sub)}
#hdr .t2{font-size:14px;letter-spacing:.04em}
/* 左ナビ */
#nav{position:absolute;left:70px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:22px;z-index:5}
#nav button{display:flex;align-items:center;gap:14px;background:none;border:none;color:var(--txt);font:inherit;font-size:15px;cursor:pointer;padding:0;opacity:.85}
#nav button .ni{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
#nav button .ni svg{width:20px;height:20px;fill:currentColor}
#nav button.on{opacity:1;color:var(--gold)}
#nav button.on .ni{background:rgba(231,197,138,.18);border:1px solid rgba(231,197,138,.7);box-shadow:0 0 14px rgba(231,197,138,.35)}
#nav button:hover{opacity:1}
/* 右パネル */
#panel{position:absolute;right:28px;top:48px;bottom:24px;width:300px;z-index:5;display:flex;flex-direction:column;min-height:0}
.p-name{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:500;letter-spacing:.04em}
.p-name .star{color:var(--gold);font-size:18px}
.p-name .pcls{margin-left:auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.p-name .pcls img{width:100%;height:100%;object-fit:contain}
.p-job{display:flex;align-items:center;gap:8px;margin-top:6px;background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.04));padding:4px 10px;font-size:13px;border-radius:2px}
.p-job img{width:18px;height:18px;object-fit:contain}
.p-san{margin-top:12px;display:flex;align-items:baseline;gap:6px;font-family:var(--num)}
.p-san .lb{font-size:13px;color:var(--sub)}
.p-san .v{font-size:22px;font-weight:400}
.p-san .m{font-size:16px;color:var(--sub)}
.p-bar{position:relative;height:5px;background:rgba(255,255,255,.18);border-radius:3px;margin-top:4px;overflow:hidden}
.p-bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#cfc8ff,#fff);border-radius:3px}
.p-tabs{display:flex;margin:14px 0 8px;background:rgba(255,255,255,.08);border-radius:14px;padding:2px}
.p-tabs button{flex:1;border:none;background:none;color:var(--txt);font:inherit;font-size:13px;padding:4px 0;border-radius:12px;cursor:pointer}
.p-tabs button.on{background:#f1eef8;color:#1b1832;font-weight:500}
.p-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.p-list::-webkit-scrollbar{display:none}
.row{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:14px}
.row .ri{width:16px;color:var(--sub);text-align:center;font-size:11px}
.row .rv{margin-left:auto;font-family:var(--num);font-size:15px}
.p-more{display:block;margin:8px auto 0;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);color:var(--txt);font:inherit;font-size:12px;padding:3px 34px;border-radius:12px;cursor:pointer}
.sec-h{font-size:12px;color:var(--gold);margin:10px 0 2px;display:flex;align-items:center;gap:8px}
.sec-h::after{content:'';flex:1;height:1px;background:var(--line)}
/* 情報 */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;font-size:13px;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--sub);flex:none}
.kv span:last-child{text-align:right;word-break:break-word}
.intro-h{margin:16px 0 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.intro-h::after{content:'';flex:1;height:1px;background:var(--line)}
.intro{font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:#e6e2f2}
#btns{position:absolute;right:28px;bottom:22px;display:flex;gap:14px;z-index:6}
#btns button{min-width:96px;padding:7px 18px;border-radius:18px;border:none;background:#f1eef8;color:#1b1832;font:inherit;font-size:13px;font-weight:500;cursor:pointer}
/* ボイス */
.vtab{align-self:flex-end;display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:2px;margin-bottom:8px}
.vtab span{padding:3px 16px;border-radius:10px;background:#f1eef8;color:#1b1832;font-size:12px}
.vrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 10px;border:none;border-bottom:1px solid var(--line);background:none;color:var(--txt);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.vrow:hover{background:rgba(255,255,255,.05)}
.vrow.on{background:rgba(255,255,255,.14)}
.vrow .vp{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:8px}
#back{position:absolute;right:26px;top:18px;z-index:7;background:none;border:none;color:var(--txt);font-size:22px;cursor:pointer;line-height:1}
#sub{position:absolute;left:12%;right:calc(28px + 300px + 4%);bottom:17%;z-index:5;text-align:center;font-size:clamp(14px,1.6vw,18px);text-shadow:0 1px 6px #000;display:none}
#sub.show{display:block}
#sub::before{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);margin-bottom:12px}
/* 関係・ネタバレ */
.lockrow{display:flex;gap:6px;align-items:center;margin:6px 0 12px}
.lockrow input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--txt);padding:4px 8px;font:inherit;font-size:12px;border-radius:12px}
.lockrow button{border:none;background:#f1eef8;color:#1b1832;font:inherit;font-size:12px;padding:4px 14px;border-radius:12px;cursor:pointer}
/* コスチューム */
#panel.cpanel{top:30px;bottom:70px;align-items:center;justify-content:center;background:linear-gradient(transparent,rgba(10,8,25,.35) 20%,rgba(10,8,25,.35) 80%,transparent)}
.cwrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:min(58%,380px);overflow:hidden;padding:8px 0}
.cc{position:relative;flex:none;height:100%;aspect-ratio:1/2.1;border-radius:999px;padding:5px;border:1px solid rgba(255,255,255,.55);cursor:pointer}
.cc::before{content:'';position:absolute;inset:-6px;border-radius:999px;border:1px solid rgba(255,255,255,.22)}
.cc-in{position:relative;width:100%;height:100%;border-radius:999px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#d8b787,#7a5a3c 70%);container-type:size}
.cc-in img{position:absolute;left:calc(50% + var(--x,0)*1cqh);top:calc(50% + var(--y,0)*1cqh);height:calc(var(--z,100)*1cqh);width:auto;max-width:none;transform:translate(-50%,-50%);pointer-events:none}
.cc.side{height:82%;opacity:.45;position:absolute;top:9%}
.cc.side.l{right:calc(50% + 70px)}
.cc.side.r{left:calc(50% + 70px)}
.cc.main{z-index:2}
.cc-own{position:absolute;left:0;right:0;bottom:16%;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 4px #000}
.cdots{display:flex;gap:6px;justify-content:center;margin:12px 0 6px}
.cdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer}
.cdots i.on{background:#fff}
.cname{font-size:22px;letter-spacing:.06em;text-align:center}
.cline{display:flex;align-items:center;justify-content:center;margin:4px 0;width:80%}
.cline span{flex:1;height:1px;background:rgba(255,255,255,.5);position:relative}
.cline span::after{content:'';position:absolute;left:50%;top:-3px;width:6px;height:6px;border:1px solid #fff;border-radius:50%;transform:translateX(-50%);background:#14122c}
.cpc{font-size:16px;color:var(--sub);text-align:center}
.cdesc{margin-top:8px;width:100%;text-align:center;font-size:12px;color:var(--gold);background:linear-gradient(90deg,transparent,rgba(0,0,0,.45),transparent);padding:4px 8px;white-space:pre-wrap;word-break:break-word}
#btns .usebtn{min-width:240px;border-radius:2px;background:#eceaf2}
#btns .usebtn:disabled{opacity:.6;cursor:default}
html.compact .cname{font-size:13.1px}
html.compact .cpc{font-size:9.8px}
html.compact .cdesc{font-size:8.2px;margin-top:4px}
html.compact .cdots{margin:6px 0 2px}
html.compact .cc.side.l{right:calc(50% + 46px)}
html.compact .cc.side.r{left:calc(50% + 46px)}
html.compact #btns .usebtn{min-width:160px}
/* ストーリー */
.story-b{margin-bottom:12px}
.story-b b{display:block;font-size:13px;color:var(--gold);margin-bottom:3px;font-weight:500}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.8;z-index:9}
/* 低い画面（スマホ横向き） */
html.compact #hdr{left:14px;top:8px}
html.compact #hdr .hic{width:28px;height:28px}
html.compact #hdr .t2{font-size:9.8px}
html.compact #nav{left:26px;gap:12px}
html.compact #nav button{font-size:9.8px;gap:8px}
html.compact #nav button .ni{width:28px;height:28px}
html.compact #nav button .ni svg{width:15px;height:15px}
html.compact #panel{right:14px;top:32px;bottom:10px;width:240px}
html.compact .p-name{font-size:14.8px}
html.compact .p-name .pcls{width:26px;height:26px}
html.compact .p-job{font-size:9px;padding:2px 8px}
html.compact .p-san{margin-top:6px}
html.compact .p-san .v{font-size:13.9px}
html.compact .p-tabs{margin:8px 0 4px}
html.compact .p-tabs button{font-size:9px;padding:2px 0}
html.compact .row{font-size:9.8px;padding:3px 2px}
html.compact .row .rv{font-size:10.7px}
html.compact .kv{font-size:9px;padding:4px 2px}
html.compact .intro-h{margin:8px 0 4px;font-size:9.8px}
html.compact .intro{font-size:9px}
html.compact #btns{right:14px;bottom:8px;gap:8px}
html.compact #btns button{min-width:70px;padding:4px 12px;font-size:9px}
html.compact .vrow{padding:7px 8px;font-size:9.8px}
html.compact #sub{right:calc(14px + 240px + 3%);font-size:10.7px;bottom:14%}
html.compact #back{right:14px;top:8px;font-size:14.8px}

/* スマホ（compact）：文字を全体的に小さく */
html.compact #hdr .hic{font-size:13.1px}
html.compact #hdr .t1{font-size:9px}
html.compact .p-name .star{font-size:14.8px}
html.compact .p-san .lb{font-size:10.7px}
html.compact .p-san .m{font-size:13.1px}
html.compact .row .ri{font-size:9px}
html.compact .p-more{font-size:9.8px}
html.compact .sec-h{font-size:9.8px}
html.compact .vtab span{font-size:9.8px}
html.compact .vrow .vp{font-size:6.6px}
html.compact .lockrow input{font-size:9.8px}
html.compact .lockrow button{font-size:9.8px}
html.compact .cc-own{font-size:9.8px}
html.compact .story-b b{font-size:10.7px}
</style>
</head>

  if(url.includes('dropbox.com')){let u=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('dropbox.com','dl.dropboxusercontent.com');u=u.replace(/([?&])dl=[01]/,'$1raw=1');if(!/[?&]raw=1/.test(u))u+=(u.includes('?')?'&':'?')+'raw=1';return u;}
  return url;
}

function tokuchoLabel(v){ if(v===""||v==null)return ""; if(v==="ng")return "（×）採用不可"; const i=parseInt(v,10); return (Number.isInteger(i)&&tokuchoLabels[i])?tokuchoLabels[i]:""; }
function dbBonus(t){ if(t<=12)return'-1D6'; if(t<=16)return'-1D4'; if(t<=24)return'0'; if(t<=32)return'+1D4'; if(t<=40)return'+1D6'; if(t<=56)return'+2D6'; if(t<=72)return'+3D6'; if(t<=88)return'+4D6'; return'+5D6'; }

function build(row){
  let sheet={}; try{sheet=JSON.parse(row.data)||{};}catch(e){}
  const inp=sheet.inputs||{};
  const ab={};
  ['str','con','pow','dex','app','siz','int_v','edu'].forEach(a=>{
    const b=num(inp[a]); const stem=a==='int_v'?'int':a;
    ab[a]=b==null?null:b+(num(inp[stem+'_m'])||0)+(num(inp[stem+'_t'])||0);
  });
  const add=k=>(num(inp[k+'_m'])||0)+(num(inp[k+'_t'])||0);
  const v=x=>x==null?0:x;
  const sub={
    HP:Math.ceil((v(ab.con)+v(ab.siz))/2)+add('hp'), MP:v(ab.pow)+add('mp'),
    'アイデア':v(ab.int_v)*5+add('idea'), '幸運':v(ab.pow)*5+add('luck'), '知識':Math.min(99,v(ab.edu)*5+add('know')),
    DB:dbBonus(v(ab.str)+v(ab.siz))
  };
  const sk=[]; let mythos=0;
  (sheet.skills||[]).forEach(s=>{
    if(!s||!s.key)return;
    const isCustom=s.key.startsWith('custom_');
    let nm=isCustom?(s.freeVal||'').trim():SKMAP[s.key];
    if(!nm)return;
    if(!isCustom && s.freeVal && s.freeVal.trim()) nm=nm+'('+s.freeVal.trim()+')';
    let base=num(s.base)||0;
    if(s.key==='kaihi')base=v(ab.dex)*2; else if(s.key==='kokugo')base=v(ab.edu)*5;
    const pts=(num(s.job)||0)+(num(s.int)||0)+(num(s.grw)||0)+(num(s.oth)||0);
    const total=base+pts;
    if(SKMAP[s.key]==='クトゥルフ神話')mythos=total;
    const sec=isCustom?((s.tbodyId||'').replace('tbody_','')||'know'):(STD_SEC[SKMAP[s.key]]||'know');
    if(pts>0) sk.push({nm,total,sec,ord:CS_SKILL_ORDER.indexOf(SKMAP[s.key])});
  });
  const sanNow=num(inp.san_now);
  return {
    id:row.id, name:inp.pcname||row.char_name||'名無し', furigana:inp.furigana||'', job:inp.job||'',
    status:inp.pc_status||'alive', cls:parseInt(inp.ark_class)||0,
    img:inp.charImage?fixDropbox(inp.charImage):'',
    crop:(()=>{ const f=(k,d)=>{ const v=parseFloat(inp[k]); return isNaN(v)?d:v; }; return {z:f('ark_img_z',100),x:f('ark_img_x',0),y:f('ark_img_y',0)}; })(),
    defDesc:inp.ark_def_desc||'',
    extraOutfits:(()=>{ try{ const v=JSON.parse(inp.ark_outfits||'[]'); return Array.isArray(v)?v.filter(o=>o&&o.url):[]; }catch(e){ return []; } })(),
    ab, sub, sanNow:sanNow==null?(v(ab.pow)*5):sanNow, sanMax:99-mythos, sanInit:v(ab.pow)*5+add('san'),
    prof:[['職業',inp.job],['年齢',inp.age],['性別',inp.gender],['身長',inp.height],['体重',inp.weight],['出身',inp.origin],['誕生日',inp.birthday],['髪の色',inp.hair],['瞳の色',inp.eye],['時代',inp.era]].filter(x=>x[1]&&String(x[1]).trim()),
    freeMemo:inp.row1_memo||'',
    tokucho:[[inp.t1_sel,inp.t1_memo],[inp.t2_sel,inp.t2_memo]].map(([v,m])=>({l:tokuchoLabel(v),m:(m||'').trim()})).filter(x=>x.l||x.m),
    voices:(()=>{ try{ const v=JSON.parse(inp.ark_voices||'[]'); return Array.isArray(v)?v.filter(x=>x&&x.url):[]; }catch(e){ return []; } })(),
    scenarios:(sheet.scenarios||[]).filter(x=>x&&x.trim()),
    sk, memos:(sheet.memos||[]).filter(m=>m&&(m.title||m.body)),
    rels:(sheet.rels||[]).filter(r=>r&&(r.name||(r.rows||[]).some(x=>x.title||x.body))),
    secrets:(sheet.secrets||[]).filter(x=>x&&(x.title||x.summary||(x.contents||[]).some(t=>t)))
  };
}

let scr='detail', ptab='status', more=false, story=false, D=null;
let worn=0, csel=0; const unlocked=new Set();
function curOutfit(){ return (D.outfits&&D.outfits[scr==='costume'?csel:worn])||{img:D.img,crop:D.crop}; }
let audio=null, playing=-1, typeTimer=null;

function pathImg(){ return (D.path>=1&&D.path<=HSR_PATHS.length)?HSR_PATHS[D.path-1]:null; }
function clsImg(){ return (D.cls>=1&&D.cls<=ARK_ICONS.length)?ARK_ICONS[D.cls-1]:null; }
function stageHTML(){
  const O=curOutfit();
  if(!O.img) return `<div class="noimg">${esc(D.name.charAt(0))}</div>`;
  // 情報・ボイス＝シートで設定したクロップ、それ以外＝画像の全景を中央
  if(scr==='info'||scr==='voice'||scr==='rel'||scr==='secret') return `<img class="crop" src="${esc(O.img)}" alt="" style="--z:${O.crop.z};--x:${O.crop.x};--y:${O.crop.y}" onerror="this.remove()">`;
  return `<img class="full" src="${esc(O.img)}" alt="" onerror="this.remove()">`;
}
function headerHTML(){
  const t1={detail:'キャラクター詳細',info:'情報',voice:'ボイス',rel:'関係',secret:'ネタバレ',costume:'コスチューム'}[scr];
  // 左上：シートで選んだ運命アイコン（未設定ならキャラのアイコン画像）
  const pa=pathImg();
  const ic=pa?`<div class="hic hic-path" title="${pa.n}"><img src="${pa.s}" alt=""></div>`:D.icon.url?`<div class="hic" style="background-image:url('${esc(D.icon.url)}');background-size:${D.icon.size};background-position:${D.icon.pos}"></div>`:`<div class="hic">${esc(D.name.charAt(0))}</div>`;
  return `<div id="hdr">${ic}<div><div class="t1">${t1}</div><div class="t2">${esc(D.name)}${D.furigana?'／'+esc(D.furigana):''}</div></div></div>`;
}
function navHTML(){
  if(scr==='voice') return '';
  const it=[['detail','詳細'],['info','情報']];
  if(D.rels.length)it.push(['rel','関係']);
  if(D.secrets.length)it.push(['secret','ネタバレ']);
  if(D.outfits&&D.outfits.length>1)it.push(['costume','コスチューム']);
  return `<div id="nav">${it.map(([k,l])=>`<button class="${scr===k?'on':''}" onclick="go('${k}')"><span class="ni">${SVGI[k]}</span>${l}</button>`).join('')}</div>`;
}
function nameBlock(){
  const ci=clsImg();
  // 名前の右：シートで選んだ属性アイコン（透過のまま表示）
  const el=(D.elem>=1&&D.elem<=HSR_ELEMS.length)?HSR_ELEMS[D.elem-1]:null;
  return `<div class="p-name"><span>${esc(D.name)}</span>${el?`<span class="pcls" title="${el.n}"><img src="${el.s}" alt=""></span>`:''}</div>`+
    `<div class="p-job">${pathImg()?`<img src="${pathImg().s}" alt="" title="${pathImg().n}">`:''}<span>${esc(D.job||'—')}</span></div>`;
}
function detailPanel(){
  const pct=Math.max(0,Math.min(100,D.sanMax>0?D.sanNow/D.sanMax*100:0));
  let h=nameBlock()+
    `<div class="p-san"><span class="lb">SAN</span><span class="v">${D.sanNow}</span><span class="m">/${D.sanMax}</span></div>`+
    `<div class="p-bar"><i style="width:${pct.toFixed(1)}%"></i></div>`+
    `<div class="p-tabs"><button class="${ptab==='status'?'on':''}" onclick="setPtab('status')">ステータス</button><button class="${ptab==='skill'?'on':''}" onclick="setPtab('skill')">技能</button></div>`;
  let list='';
  if(ptab==='status'){
    const r=(i,l,v)=>`<div class="row"><span class="ri">${i}</span><span>${l}</span><span class="rv">${esc(String(v))}</span></div>`;
    const L={str:'STR',con:'CON',pow:'POW',dex:'DEX',app:'APP',siz:'SIZ',int_v:'INT',edu:'EDU'};
    list+=Object.keys(L).map(a=>r('・',L[a],D.ab[a]==null?'-':D.ab[a])).join('');
    if(more){
      list+=`<div class="sec-h">副能力値</div>`+r('♥','HP',D.sub.HP)+r('◆','MP',D.sub.MP)+r('✦','アイデア',D.sub['アイデア'])+r('✧','幸運',D.sub['幸運'])+r('❖','知識',D.sub['知識'])+r('➹','DB',D.sub.DB)+r('・','初期SAN',D.sanInit);
    }
    list+=`<button class="p-more" onclick="more=!more;draw()">${more?'閉じる':'詳細'}</button>`;
  }else{
    if(!D.sk.length) list='<div class="row" style="color:var(--sub)">ポイントを振った技能がありません</div>';
    else list=SEC_DEF.map(([k,lab])=>{
      const l=D.sk.filter(s=>s.sec===k).sort((a,b)=>(a.ord<0?999:a.ord)-(b.ord<0?999:b.ord));
      return l.length?`<div class="sec-h">${lab}</div>`+l.map(s=>`<div class="row"><span class="ri">・</span><span>${esc(s.nm)}</span><span class="rv">${s.total}</span></div>`).join(''):'';
    }).join('');
  }
  return h+`<div class="p-list">${list}</div>`;
}
function infoPanel(){
  if(story){
    const blocks=[];
    if(D.freeMemo.trim())blocks.push(['自由メモ',D.freeMemo]);
    D.memos.forEach(m=>blocks.push([m.title||'メモ',m.body||'']));
    return nameBlock()+`<div class="intro-h">メモ</div><div class="p-list">${blocks.length?blocks.map(([t,b])=>`<div class="story-b"><b>${esc(t)}</b><div class="intro">${esc(b)}</div></div>`).join(''):'<div class="intro" style="color:var(--sub)">メモがありません</div>'}</div>`;
  }
  const kv=D.prof.filter(([a])=>a!=='職業').map(([a,b])=>`<div class="kv"><span>${a}</span><span>${esc(b)}</span></div>`).join('');
  const intro=D.tokucho.map(t=>(t.l?t.l:'')+(t.l&&t.m?'\n':'')+t.m).join('\n\n');
  return nameBlock()+`<div class="p-list" style="margin-top:12px">${kv}`+
    (intro?`<div class="intro-h">特徴表</div><div class="intro">${esc(intro)}</div>`:'')+`</div>`;
}
function relPanel(){
  return nameBlock()+`<div class="p-list" style="margin-top:12px">`+D.rels.map(r=>`<div class="intro-h">${esc(r.name||'関係')}</div>`+
    (r.rows||[]).filter(x=>x.title||x.body).map(x=>`<div class="story-b">${x.title?`<b>${esc(x.title)}</b>`:''}<div class="intro">${esc(x.body||'')}</div></div>`).join('')).join('')+`</div>`;
}
function secretPanel(){
  return nameBlock()+`<div class="p-list" style="margin-top:12px">`+D.secrets.map((x,i)=>{
    let h=`<div class="intro-h">${esc(x.title||'ネタバレ')}</div>`;
    if(x.summary)h+=`<div class="intro" style="margin-bottom:8px">${esc(x.summary)}</div>`;
    const cs=(x.contents||[]).map((t,j)=>({t:(x.contentTitles||[])[j]||'',b:t||''})).filter(c=>c.t||c.b);
    if(!cs.length)return h;
    if(unlocked.has(i)) return h+cs.map(c=>`<div class="story-b">${c.t?`<b>${esc(c.t)}</b>`:''}<div class="intro">${esc(c.b)}</div></div>`).join('')+`<div class="lockrow"><button onclick="unlocked.delete(${i});draw()">閉じる</button></div>`;
    return h+`<div class="lockrow">${x.pass?`<input type="password" id="sp${i}" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlockSec(${i})">`:''}<button onclick="unlockSec(${i})">解除</button></div>`;
  }).join('')+`</div>`;
}
function unlockSec(i){ const x=D.secrets[i], inp=document.getElementById('sp'+i); if(!x.pass||(inp&&inp.value===x.pass)){ unlocked.add(i); draw(); } else alert('パスワードが違います'); }
function costumePanel(){
  const L=D.outfits, n=L.length, cur=L[csel];
  const card=(o,cls,i)=>`<div class="cc ${cls}" onclick="selCos(${i})"><div class="cc-in">${o.img?`<img src="${esc(o.img)}" alt="" style="--z:${o.crop.z};--x:${o.crop.x};--y:${o.crop.y}">`:''}${i===worn?'<span class="cc-own">使用中</span>':''}</div></div>`;
  return `<div class="cwrap">`+
    (n>1?card(L[(csel-1+n)%n],'side l',(csel-1+n)%n):'')+card(cur,'main',csel)+(n>2?card(L[(csel+1)%n],'side r',(csel+1)%n):'')+
    `</div><div class="cdots">${L.map((_,i)=>`<i class="${i===csel?'on':''}" onclick="selCos(${i})"></i>`).join('')}</div>`+
    `<div class="cname">${esc(cur.name)}</div><div class="cline"><span></span></div><div class="cpc">${esc(D.name)}</div>`+
    (cur.desc?`<div class="cdesc">${esc(cur.desc)}</div>`:'');
}
function selCos(i){ csel=i; draw(); }
function useCos(){ worn=csel; try{ localStorage.setItem('hsr_wear_'+D.id,String(worn)); }catch(_){} draw(); }
function voicePanel(){
  return `<div class="vtab"><span>ボイス</span></div><div class="p-list">`+
    (D.voices.length?D.voices.map((v,i)=>`<button class="vrow${playing===i?' on':''}" onclick="playVoice(${i})"><span class="vp">${playing===i?'■':'▶'}</span><span>${esc(v.title||'(無題)')}</span></button>`).join(''):'<div class="row" style="color:var(--sub)">ボイスがありません</div>')+`</div>`;
}
function draw(){
  document.getElementById('stage').innerHTML=stageHTML();
  let ui=headerHTML()+navHTML();
  if(scr==='detail') ui+=`<div id="panel">${detailPanel()}</div>`;
  if(scr==='info') ui+=`<div id="panel" style="bottom:70px">${infoPanel()}</div><div id="btns"><button onclick="go('voice')">ボイス</button><button onclick="story=!story;draw()">${story?'情報':'メモ'}</button></div>`;
  if(scr==='rel') ui+=`<div id="panel">${relPanel()}</div>`;
  if(scr==='secret') ui+=`<div id="panel">${secretPanel()}</div>`;
  if(scr==='costume') ui+=`<div id="panel" class="cpanel">${costumePanel()}</div><div id="btns"><button class="usebtn" ${csel===worn?'disabled':''} onclick="useCos()">${csel===worn?'使用中':'使用'}</button></div>`;
  if(scr==='voice') ui+=`<button id="back" title="戻る" onclick="go('info')">⮌</button><div id="panel" style="top:44px">${voicePanel()}</div><div id="sub"></div>`;
  document.getElementById('ui').innerHTML=ui;
}
function go(s){ if(scr==='voice'&&s!=='voice')stopVoice(); if(s==='costume'&&scr!=='costume')csel=worn; scr=s; story=false; draw(); }
function setPtab(t){ ptab=t; draw(); }
function showLine(t){
  const el=document.getElementById('sub'); if(!el)return;
  clearInterval(typeTimer);
  if(!t){ el.classList.remove('show'); el.textContent=''; return; }
  el.classList.add('show'); el.textContent='';
  const ch=[...t]; let n=0;
  typeTimer=setInterval(()=>{ n++; el.textContent=ch.slice(0,n).join(''); if(n>=ch.length)clearInterval(typeTimer); },40);
}
function stopVoice(){ if(audio){ try{audio.pause();}catch(_){} audio=null; } playing=-1; clearInterval(typeTimer); }
function playVoice(i){
  const was=playing; stopVoice();
  if(was===i){ draw(); return; }
  const v=D.voices[i]; if(!v)return;
  audio=new Audio(fixDropbox(v.url)); playing=i;
  audio.onended=()=>{ stopVoice(); draw(); };
  audio.play().catch(()=>{ stopVoice(); draw(); alert('再生できませんでした'); });
  draw(); showLine((v.line||'').trim());
}
// 星空
function drawStars(){
  const c=document.getElementById('stars'), app=document.getElementById('app');
  const w=app.clientWidth, h=app.clientHeight, dpr=window.devicePixelRatio||1;
  c.width=w*dpr; c.height=h*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  let s=12345; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<Math.round(w*h/2600);i++){
    const x=rnd()*w, y=rnd()*h*0.8, r=rnd()<0.92?rnd()*0.9+0.2:rnd()*1.6+0.8, a=rnd()*0.7+0.3;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=`rgba(255,255,255,${a})`; g.fill();
  }
}
async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const msg=t=>{const m=document.getElementById('msg');m.style.display='flex';m.innerHTML=t;};
  if(!id){msg('IDが指定されていません');return;}
  let row=null;
  try{ const r=await db.from('character_sheets').select('*').eq('id',id).single(); if(!r.error&&r.data)row=r.data; }catch(e){}
  if(!row){ try{ if(window.OCO){ const rec=await OCO.getOne(id); if(rec&&rec.data)row={id,char_name:rec.char_name,data:rec.data}; } }catch(_){} }
  if(!row){msg('データが見つかりません');return;}
  let sheet={}; try{sheet=JSON.parse(row.data)||{};}catch(e){}
  if(sheet.share_rev && params.get('r')!==sheet.share_rev){
    msg('このリンクは無効です。<br>閲覧URLが再生成された可能性があります。<br>最新のURLを共有者にご確認ください。');return;
  }
  D=build(row);
  // 左上アイコン（一覧と同じ切り抜き：charImagePos / charImageScale）
  { const inp=sheet.inputs||{}; D.elem=parseInt(inp.hsr_elem)||0; D.path=parseInt(inp.hsr_path)||0; const pos=(inp.charImagePos||'50% 30%').split(' ');
    D.icon={url:D.img, pos:(parseFloat(pos[0])||50)+'% '+(parseFloat(pos[1]||pos[0])||30)+'%', size:Math.round((parseFloat(inp.charImageScale)||1.3)*100)+'%'}; }
  { const n2=(v,d)=>{ v=parseFloat(v); return isNaN(v)?d:v; };
    D.outfits=[{name:'デフォルト',img:D.img,desc:D.defDesc,crop:D.crop}].concat(D.extraOutfits.map((o,i)=>({name:o.name||('コーデ'+(i+1)),img:fixDropbox(o.url),desc:o.desc||'',crop:{z:n2(o.z,100),x:n2(o.x,0),y:n2(o.y,0)}})));
    try{ const w=parseInt(localStorage.getItem('hsr_wear_'+D.id)); if(w>=0&&w<D.outfits.length)worn=w; }catch(_){} }
  document.getElementById('msg').style.display='none';
  document.title=D.name+' - キャラクター詳細';
  draw();
}
function fitView(){
  let w=window.innerWidth, h=window.innerHeight; const app=document.getElementById('app');
  // ホーム画面アプリ（iOS）では innerHeight がステータスバー分短く報告され、下の余白が広がるため画面の高さを使う
  const standalone=window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(standalone&&h>w&&screen.height>h&&screen.width===w) h=screen.height;
  const rot = h>w && w<=760;
  document.documentElement.classList.toggle('rot',rot);
  // ノッチ・ステータスバー・ホームバー（セーフエリア）を避ける
  let pr=document.getElementById('_safe_probe');
  if(!pr){ pr=document.createElement('div'); pr.id='_safe_probe'; pr.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(pr); }
  const cs=getComputedStyle(pr), st=34, sb=34, sl=parseFloat(cs.paddingLeft)||0, sr=parseFloat(cs.paddingRight)||0;
  if(rot){ app.style.top=st+'px'; app.style.left=sl+'px'; app.style.width=(h-st-sb)+'px'; app.style.height=(w-sl-sr)+'px'; } else { app.style.top=''; app.style.left=''; app.style.width=''; app.style.height=''; }
  if(rot){ h=h-st-sb; w=w-sl-sr; }
  document.documentElement.classList.toggle('compact',(rot?w:h)<=520);
  drawStars();
}
window.addEventListener('resize',fitView);
window.addEventListener('orientationchange',()=>setTimeout(fitView,200));
fitView();
init();
</script>
