<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1c1e">
<title>プロフィール</title>
<link rel="manifest" href="./manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./offline.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=Jost:wght@300;400;500&display=swap');
:root{--ink:#111;--bar:#1c1c1e;--panel:#d9d9d9;--line:#b5b5b5;--acc:#e2aa46;--font:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;--ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:#eee;font-family:var(--ui);overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
/* スマホ縦持ち時は横向き（90°回転）で表示 */
html.rot #app{position:fixed;top:0;left:0;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#main{flex:1;display:flex;min-height:0}
/* 左：立ち絵ステージ */
#stage{position:relative;flex:1.3;min-width:0;background:linear-gradient(135deg,#e4e4e4,#a9a9a9);overflow:hidden;container-type:size}
/* 立ち絵クロップ（シートで設定：ステージ高さ基準） */
#stage img.art{position:absolute;left:calc(50% + var(--x,0)*1cqh);top:calc(50% + var(--y,0)*1cqh);height:calc(var(--z,100)*1cqh);width:auto;max-width:none;transform:translate(-50%,-50%)}
#stage .empty{position:absolute;inset:0;display:grid;place-items:center;color:#888;font-family:var(--font);font-size:min(30vw,260px);opacity:.25}
#nameplate{position:absolute;left:24px;right:22px;bottom:62px;color:#fff;text-shadow:0 2px 8px #000a;pointer-events:none}
#nameplate .role{display:flex;align-items:center;gap:8px}
#nameplate .san{position:relative;flex:none;width:62px;height:62px;border-radius:50%;background:conic-gradient(#e2aa46 calc(var(--p,0)*1%),rgba(255,255,255,.16) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-shadow:none}
#nameplate .san::before{content:'';position:absolute;inset:4px;border-radius:50%;background:rgba(20,20,26,.92)}
#nameplate .san span{position:relative}
#nameplate .san .lab{font-family:'Jost',sans-serif;font-size:10px;color:#e2aa46;font-weight:400;letter-spacing:.5px}
#nameplate .san .val{font-family:'Jost',sans-serif;font-size:28px;color:#fff;font-weight:300;margin-top:-1px;line-height:1}
#nameplate .cls{width:58px;height:58px;display:flex;align-items:center;justify-content:center;flex:none}
#nameplate .cls img{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
#nameplate .en{font-size:26px;margin-top:6px;letter-spacing:.04em}
#nameplate .nm{font-size:clamp(34px,6vw,72px);font-family:var(--font);font-weight:700;line-height:1.1;word-break:break-word}
#dialog{position:absolute;left:12px;right:12px;bottom:58px;z-index:4;background:rgba(17,17,17,.84);border:1px solid #444;color:#fff;padding:14px 18px;min-height:84px;font-size:clamp(14px,1.6vw,18px);line-height:1.85;white-space:pre-wrap;word-break:break-word;display:none}
#dialog.show{display:block}
#dialog .tag{position:absolute;top:-17px;left:-1px;background:#bbb;color:#222;font-size:11px;padding:1px 8px;letter-spacing:.06em}
#stage.outfit-mode #nameplate,#stage.outfit-mode #credit,#stage.outfit-mode #dialog,#stage.outfit-mode .stbadge{display:none}
.ocard{position:absolute;right:16px;bottom:16px;width:min(270px,44%);background:#fff;color:#111;padding:10px 12px 12px;box-shadow:0 2px 10px #0004;z-index:3}
.ocard-nm{font-size:clamp(20px,2.6vw,34px);font-weight:700;letter-spacing:.04em;line-height:1.1;word-break:break-word;font-family:var(--font)}
.ocard-sub{background:#111;color:#fff;font-size:10px;letter-spacing:.3em;text-align:center;margin:4px 0 6px}
.ocard-desc{font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:9.6em;overflow:auto}
.owrap{min-height:100%;display:flex;flex-direction:column;justify-content:center}
.otabs{display:flex;gap:18px;padding:0 6px 6px;border-bottom:1px solid #9a9a9a;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.otabs::-webkit-scrollbar,.othumbs::-webkit-scrollbar{display:none}
.otabs button{background:none;border:none;border-bottom:3px solid transparent;padding:6px 2px;font:inherit;font-size:16px;color:#555;cursor:pointer;white-space:nowrap;font-family:var(--font)}
.otabs button.on{color:#111;border-bottom-color:#111;font-weight:700}
.ostrip{display:flex;align-items:center;gap:6px}
.oarr{flex:none;background:none;border:none;font-size:20px;color:#333;cursor:pointer;padding:8px 4px}
.othumbs{flex:1;display:flex;gap:6px;overflow-x:auto;justify-content:safe center;padding:4px 2px 10px;scrollbar-width:none}
.othumb{position:relative;flex:none;width:92px;height:clamp(150px,36vh,300px);container-type:size;overflow:hidden;background:#2a2a30;cursor:pointer;opacity:.55;transition:opacity .15s}
.othumb.sel{opacity:1;outline:3px solid var(--acc);outline-offset:-3px;width:120px}
.othumb img{position:absolute;left:calc(50% + var(--x,0)*1cqh);top:calc(50% + var(--y,0)*1cqh);height:calc(var(--z,100)*1cqh);width:auto;max-width:none;transform:translate(-50%,-50%);pointer-events:none}
.owear{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);color:#fff;font-size:11px;text-align:center;padding:2px 0}
.obtnrow{display:flex;justify-content:center;margin:14px 0 6px}
.obtn{min-width:200px;padding:10px 20px;border:none;background:#2b2b2d;color:#fff;font:inherit;font-size:16px;cursor:pointer;letter-spacing:.1em}
.obtn.worn{background:#5aa6d0;cursor:default}
html.compact .othumb{width:60px;height:150px}
html.compact .othumb.sel{width:76px}
html.compact .otabs{margin-bottom:6px}
html.compact .otabs button{font-size:13px;padding:3px 2px}
html.compact .obtnrow{margin:6px 0 2px}
html.compact .obtn{min-width:150px;padding:6px 14px;font-size:13px}
html.compact .ocard{right:8px;bottom:8px;padding:6px 8px 8px}
html.compact .ocard-desc{font-size:10px;max-height:6.4em}
#credit{position:absolute;left:0;bottom:0;display:flex;max-width:100%;pointer-events:none}
.cr{display:flex;align-items:stretch;min-width:260px;max-width:100%;height:46px;background:rgba(28,28,30,.85);color:#fff;font-size:16px}
.cr i{width:46px;display:grid;place-items:center;background:rgba(0,0,0,.55);flex:none}
.cr i svg{width:22px;height:22px;fill:#ddd}
.cr span{flex:1;display:grid;place-items:center;padding:0 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stbadge{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;color:#fff;padding:3px 12px;border-radius:12px}
/* 右：サイドパネル */
#side{flex:1;min-width:320px;max-width:560px;background:radial-gradient(#0002 1px,transparent 1px) 0 0/14px 14px,var(--panel);color:#111;overflow:auto;padding:14px}
#side.cards{display:flex;flex-direction:column;gap:clamp(14px,3vh,28px)}
#side.open{display:flex;gap:10px;overflow:hidden}
.card-tab{flex:1 1 0;min-height:52px;max-height:140px;display:flex;padding:0;background:#ffffff55;color:#111;border:2px solid #111;text-align:left;height:clamp(84px,15vh,140px);cursor:pointer;font:inherit}
.card-tab:hover{background:#ffffffb0}
.ico{display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#2b2b2d;color:#fff;border:0;padding:14px 0 6px;width:56px;cursor:pointer;flex:none;font:inherit}
.ico:hover{background:#444}
.ico svg{width:22px;height:22px;fill:currentColor}
.ico .plus{font-size:18px;line-height:1;color:#ccc}
.ct-label{flex:1;display:grid;place-items:center;font-family:var(--font);font-size:clamp(20px,2.6vw,30px);letter-spacing:.12em}
.vmain{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;animation:slide .2s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.vhead{display:flex;align-items:stretch;height:96px;background:#2b2b2d;color:#fff;flex:none}
.vhead .ico{background:transparent}
.vh-line{flex:1;align-self:center;height:1px;background:#777;margin:0 14px}
.vh-label{align-self:center;padding-right:22px;font-size:22px;font-family:var(--font);letter-spacing:.1em}
.vbody{flex:1;overflow:auto;margin-top:12px;padding-right:4px}
.rail{width:56px;flex:none;display:flex;flex-direction:column;gap:10px;margin-top:108px;overflow-y:auto;scrollbar-width:none}
.rail .ico{height:84px;flex:none;box-shadow:0 2px 6px #0005}
.sec-lock{display:flex;gap:6px;align-items:center;padding:0 14px 14px;font-size:13px}
.sec-lock input{border:1px solid var(--line);padding:4px 6px;font-size:13px;width:140px}
.sec-lock button{border:1px solid #2b2b2d;background:#2b2b2d;color:#fff;padding:4px 14px;cursor:pointer;font:inherit;font-size:13px}
.ph{background:#555;color:#fff;padding:6px 14px;font-size:17px;margin-bottom:8px;font-family:var(--font);letter-spacing:.06em}
.pt{white-space:pre-wrap;line-height:1.75;font-size:15px;padding:0 14px 16px;word-break:break-word}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:0 14px 16px;font-size:15px}
.kv dt{color:#555;font-weight:700}
.kv dd{margin:0;word-break:break-word}
.abtxt{display:grid;grid-template-columns:repeat(4,max-content);gap:2px 18px;padding:0 14px 16px;font-size:15px;line-height:1.75}
html.compact .abtxt{font-size:13px;gap:0 12px;padding:0 10px 10px}
.abgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 14px 16px}
.abgrid div{background:#ececec;border:1px solid var(--line);text-align:center;padding:6px 2px}
.abgrid b{display:block;font-size:11px;color:#555;letter-spacing:.06em}
.abgrid span{font-size:22px;font-weight:700}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;padding:0 14px 16px;font-size:15px}
.skgrid div{display:flex;justify-content:space-between;border-bottom:1px dotted #999;padding:2px 0}
.skgrid b{font-weight:700}
.vbtn{position:relative;overflow:hidden;display:flex;align-items:stretch;width:100%;margin:0 0 10px;padding:0;background:#ececec;border:1px solid var(--line);color:#111;text-align:left;cursor:pointer;font:inherit}
.vbtn:hover{background:#fff}
.vbtn .ic{width:44px;flex:none;display:grid;place-items:center;background:#2b2b2d;color:#fff;font-size:14px}
.vbtn .tt{flex:1;padding:12px 16px;font-size:16px;font-family:var(--font)}
.vbtn .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--acc)}
.vbtn.playing{background:#fff;border-color:var(--acc)}
.vbtn.playing .ic{background:var(--acc);color:#000}
html.compact .vbtn{margin-bottom:6px}
html.compact .vbtn .ic{width:34px}
html.compact .vbtn .tt{padding:7px 10px;font-size:13px}
.hint{color:#555;font-size:13px;padding:0 14px}
#msg{padding:40px;text-align:center;line-height:1.8}
/* ===== 最初の画面（オペレーター詳細風） ===== */
#top{position:relative;flex:1;overflow:hidden;background:#1b1b1d;color:#fff;container-type:size}
.t-bg{position:absolute;inset:0;overflow:hidden}
.t-bg i{position:absolute;display:block}
.t-bg .s1{inset:0;background:linear-gradient(115deg,#ececec 0 30%,transparent 30%)}
.t-bg .s2{left:18%;top:-10%;width:70%;height:75%;background:#fafafa;clip-path:polygon(38% 0,100% 0,62% 100%,0 100%)}
.t-bg .s3{left:30%;top:20%;width:80%;height:90%;background:#2a2a2c;clip-path:polygon(55% 0,100% 0,45% 100%,0 100%);opacity:.9}
.t-clsbg{position:absolute;left:3%;top:6%;width:min(26vh,240px);opacity:.12;filter:invert(1);pointer-events:none}
/* 立ち絵：シートで設定したクロップ（画面高さ基準）で表示 */
/* 上部ボタン（高さ約9%）に被らないよう、全体を少し下げる */
.t-art{position:absolute;left:calc(50% + var(--x,0)*1cqh);top:calc(50% + 9cqh + var(--y,0)*1cqh);height:calc(var(--z,100)*1cqh);width:auto;max-width:none;transform:translate(-50%,-50%);filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
.t-noimg{position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);font-size:40vh;color:rgba(0,0,0,.08);font-family:var(--font);font-weight:700}
.tb{border:1px solid rgba(255,255,255,.08);background:rgba(44,44,47,.92);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tb svg{width:46%;height:46%;max-width:30px;max-height:30px;fill:currentColor}
.tb:disabled{opacity:.35;cursor:default}
.tb:not(:disabled):hover{background:rgba(70,70,74,.95)}
.t-topbtns{position:absolute;left:50%;top:1.8%;height:6.8%;width:17.5%;min-width:150px;transform:translateX(-50%);z-index:5;display:flex;align-items:stretch;background:rgba(44,44,47,.92);border:1px solid rgba(255,255,255,.08)}
.t-topbtns .tb{flex:1;height:auto;background:transparent;border:none}
.t-topbtns .tb svg{height:62%;width:auto;max-width:none;max-height:none}
.t-topbtns i{flex:none;width:2px;margin:calc(var(--u,1vh)*1.3) 0;background:#6a6a6c}
.t-left{position:absolute;left:5%;top:39%;bottom:4%;width:42%;display:flex;flex-direction:column;z-index:3}
.t-ab{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u,1vh)*.5) calc(var(--uw,1vw)*.6);width:calc(var(--uw,1vw)*26);min-width:240px;margin:0 0 12px}
.t-ab div{display:flex;align-items:center;height:calc(var(--u,1vh)*3.6);min-height:20px;background:linear-gradient(90deg,rgba(255,255,255,.6),rgba(255,255,255,.18))}
.t-ab b{align-self:stretch;display:flex;align-items:center;background:#161616}
.t-ab b{flex:0 0 auto;width:42%;padding-left:calc(var(--uw,1vw)*.6);font-family:"Noto Sans JP","Zen Kaku Gothic New",sans-serif;font-weight:700;font-size:clamp(10px,calc(var(--u,1vh)*2.1),18px);color:#fff;letter-spacing:.02em;text-shadow:none;white-space:nowrap}
.t-ab span{flex:1;text-align:left;padding-left:calc(var(--uw,1vw)*.6);font-family:'Jost',sans-serif;font-weight:400;font-size:clamp(13px,calc(var(--u,1vh)*2.6),24px);line-height:1;color:#4a4a4a}
.t-en{font-size:clamp(14px,calc(var(--u,1vh)*3.3),30px);font-family:'Jost',sans-serif;font-weight:400;letter-spacing:.02em;margin-top:auto;color:#fff;text-shadow:0 0 3px #555,0 1px 2px #333}
.t-nm{font-family:var(--font);font-weight:700;font-size:clamp(30px,calc(var(--u,1vh)*8.5),80px);line-height:1.08;color:#fff;-webkit-text-stroke:1.2px #6a6a6a;paint-order:stroke fill;text-shadow:0 3px 10px rgba(0,0,0,.35);white-space:nowrap}
.t-bottom{flex:none;display:flex;gap:10px;margin-top:calc(var(--u,1vh)*2);align-items:stretch}
.t-cls{flex:none;width:clamp(52px,calc(var(--u,1vh)*12),112px);height:clamp(52px,calc(var(--u,1vh)*12),112px);background:rgba(30,30,32,.9);border:2px solid #8a8a8a;box-shadow:inset 0 0 0 3px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.t-cls img{width:78%;height:78%;object-fit:contain}
.t-tags{display:flex;flex-direction:column;gap:calc(var(--u,1vh)*.6);justify-content:flex-start}
.t-tag{align-self:stretch;text-align:center;background:rgba(60,60,62,.92);color:#fff;padding:.6vh calc(var(--uw,1vw)*1.6);font-size:clamp(12px,calc(var(--u,1vh)*2.6),24px);letter-spacing:.06em;text-shadow:none;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 2px,transparent 2px 6px)}
/* SAN（参考：LVの円＋EXPバー） */
.t-right{position:absolute;left:70%;top:12.5%;z-index:3;width:23.5%;height:calc(var(--u,1vh)*16)}
.t-san{position:absolute;left:0;top:0;z-index:2;width:calc(var(--u,1vh)*15);height:calc(var(--u,1vh)*15);border-radius:50%;background:conic-gradient(#e2aa46 calc(var(--p,0)*1%),rgba(255,255,255,.16) 0);display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-san::before{content:'';position:absolute;inset:calc(var(--u,1vh)*1);border-radius:50%;background:rgba(20,20,26,.95)}
.t-san span{position:relative;line-height:1}
.t-san .lab{position:absolute!important;top:16%;left:0;right:0;text-align:center;font-family:'Jost',sans-serif;font-size:calc(var(--u,1vh)*1.9);font-weight:400;color:#e2aa46;letter-spacing:.05em}
.t-san .val{font-family:'Jost',sans-serif;font-size:calc(var(--u,1vh)*8.6);font-weight:500;color:#fff;margin-top:calc(var(--u,1vh)*1.2);letter-spacing:-.03em}
.t-sanmax{position:absolute;left:calc(var(--u,1vh)*13);top:calc(var(--u,1vh)*11.5);font-family:'Jost',sans-serif;font-size:calc(var(--u,1vh)*3.3);font-weight:300;color:#fff}
.t-range{flex:none;width:calc(var(--uw,1vw)*9);min-width:70px;background:rgba(56,56,60,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u,1vh)*.8);padding:calc(var(--u,1vh)*1) 4px}
.t-range span{font-size:clamp(10px,calc(var(--u,1vh)*2.1),18px);color:#eee;letter-spacing:.06em}
.t-rg{display:grid;gap:2px}
.t-rg i{display:block;width:calc(var(--u,1vh)*1.7);height:calc(var(--u,1vh)*1.7);min-width:7px;min-height:7px;box-sizing:border-box}
.t-rg i.on{border:1.5px solid #ddd}
.t-rg i.me{background:#fff}
.t-tag2{font-size:clamp(10px,calc(var(--u,1vh)*2),18px)}
/* HP・MP（参考：昇進・潜在の枠） */
.t-st{position:absolute;top:34.5%;height:10%;width:11.3%;z-index:3}
.t-st1{left:70%}.t-st2{left:82%}
/* 参考：明るい帯（枠）から、数字の上半分がはみ出す */
.t-st::before{content:'';position:absolute;left:0;right:0;top:54%;bottom:6%;background:rgba(90,90,94,.85)}
.t-st .sv{position:absolute;left:10%;bottom:6%;z-index:1;font-family:'Jost',sans-serif;font-weight:400;font-size:calc(var(--u,1vh)*8.4);color:#fff;line-height:.78;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.t-st .sl{position:absolute;right:10%;top:54%;bottom:6%;z-index:1;display:flex;align-items:center;font-family:'Jost',sans-serif;font-weight:500;font-size:calc(var(--u,1vh)*2.1);color:#fff;letter-spacing:.06em}
.t-brd{margin-top:calc(var(--u,1vh)*1.2);font-size:clamp(10px,calc(var(--u,1vh)*1.9),16px);line-height:1.55;color:#ddd;background:rgba(255,255,255,.07);padding:calc(var(--u,1vh)*.8) calc(var(--uw,1vw)*.8)}
.t-sanbox{position:absolute;left:calc(var(--u,1vh)*7);right:0;top:calc(var(--u,1vh)*3.8);height:calc(var(--u,1vh)*7);background:rgba(56,56,60,.9)}
/* 素質（特徴表） */
.t-tk{display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u,1vh)*.8);margin-top:calc(var(--u,1vh)*1.4)}
.t-tk span{background:#f1f1f1;color:#1a1a1a;font-size:clamp(11px,calc(var(--u,1vh)*2.4),20px);padding:calc(var(--u,1vh)*.3) calc(var(--uw,1vw)*.6);letter-spacing:.04em}
/* 職分（参考：右下のモジュール欄） */
.t-branch{position:absolute;left:70%;width:23.3%;bottom:4%;z-index:3;background:rgba(56,56,60,.9);padding:calc(var(--u,1vh)*1.6) 1.2%}
.t-brin{display:flex;align-items:center;gap:calc(var(--uw,1vw)*1.4)}
.t-brin img{width:calc(var(--u,1vh)*8);height:calc(var(--u,1vh)*8);object-fit:contain;opacity:.9}
.t-brin span{font-size:clamp(14px,calc(var(--u,1vh)*2.8),26px);color:#fff;letter-spacing:.06em}
#backbar{position:absolute;left:12px;top:10px;z-index:20;display:flex;background:rgba(40,40,42,.92)}
#backbar .tb{position:static;background:transparent;width:56px;height:42px;min-width:0}
#backbar .tb-back{border-right:2px solid #555}
#main{position:relative}
html.compact .t-nm{-webkit-text-stroke:1px #6a6a6a}
html.compact #backbar{left:8px;top:6px}
html.compact #backbar .tb{width:40px;height:30px}

const TABS=[{k:'prof',label:'プロフィール',ic:SVG.prof},{k:'voice',label:'ボイス',ic:SVG.voice},{k:'outfit',label:'コーデ',ic:SVG.outfit},{k:'stat',label:'能力値・技能',ic:SVG.stat},{k:'rel',label:'人間関係',ic:SVG.rel},{k:'secret',label:'ネタバレメモ',ic:SVG.secret},{k:'scen',label:'通過シナリオ',ic:SVG.scen}];
// ボイス未設定ならボイスタブは出さない
function tabs(){
  if(!D)return TABS;
  const has={voice:D.voices.length, outfit:(D.outfits||[]).length>1, rel:D.rels.length, secret:D.secrets.length, scen:D.scenarios.length};
  // コーデは最初の画面の上部アイコンから開く（タブ一覧には出さない）
  // コーデ画面では他タブへの切り替えを出さない
  if(tab==='outfit')return TABS.filter(t=>t.k==='outfit');
  return TABS.filter(t=>!(t.k in has)||has[t.k]).filter(t=>t.k!=='outfit');
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function num(v){const n=parseInt(v);return isNaN(n)?null:n;}
function fixDropbox(url){
  if(!url)return'';
  if(url.includes('dropbox.com')){let u=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('dropbox.com','dl.dropboxusercontent.com');u=u.replace(/([?&])dl=[01]/,'$1raw=1');if(!/[?&]raw=1/.test(u))u+=(u.includes('?')?'&':'?')+'raw=1';return u;}
  return url;
}

function dbBonus(t){ if(t<=12)return'-1D6'; if(t<=16)return'-1D4'; if(t<=24)return'0'; if(t<=32)return'+1D4'; if(t<=40)return'+1D6'; if(t<=56)return'+2D6'; if(t<=72)return'+3D6'; if(t<=88)return'+4D6'; return'+5D6'; }

function build(row){
  let sheet={}; try{sheet=JSON.parse(row.data)||{};}catch(e){}
  const inp=sheet.inputs||{};
  const ab={};
  ['str','con','pow','dex','app','siz','int_v','edu'].forEach(a=>{
    const b=num(inp[a]); const stem=a==='int_v'?'int':a;
    ab[a]=b==null?null:b+(num(inp[stem+'_m'])||0)+(num(inp[stem+'_t'])||0);
  });
  const add=k=>(num(inp[k+'_m'])||0)+(num(inp[k+'_t'])||0);
  const v=x=>x==null?0:x;
  const sub={
    HP:Math.ceil((v(ab.con)+v(ab.siz))/2)+add('hp'), MP:v(ab.pow)+add('mp'),
    'アイデア':v(ab.int_v)*5+add('idea'), '幸運':v(ab.pow)*5+add('luck'), '知識':Math.min(99,v(ab.edu)*5+add('know')),
    DB:dbBonus(v(ab.str)+v(ab.siz))
  };
  const sk=[]; let mythos=0;
  (sheet.skills||[]).forEach(s=>{
    if(!s||!s.key)return;
    const isCustom=s.key.startsWith('custom_');
    let nm=isCustom?(s.freeVal||'').trim():SKMAP[s.key];
    if(!nm)return;
    if(!isCustom && s.freeVal && s.freeVal.trim()) nm=nm+'('+s.freeVal.trim()+')';
    let base=num(s.base)||0;
    if(s.key==='kaihi')base=v(ab.dex)*2; else if(s.key==='kokugo')base=v(ab.edu)*5;
    const pts=(num(s.job)||0)+(num(s.int)||0)+(num(s.grw)||0)+(num(s.oth)||0);
    const total=base+pts;
    if(SKMAP[s.key]==='クトゥルフ神話')mythos=total;
    const sec=isCustom?((s.tbodyId||'').replace('tbody_','')||'know'):(STD_SEC[SKMAP[s.key]]||'know');
    if(pts>0) sk.push({nm,total,sec,ord:CS_SKILL_ORDER.indexOf(SKMAP[s.key])});
  });
  const sanNow=num(inp.san_now);
  return {
    id:row.id, name:inp.pcname||row.char_name||'名無し', furigana:inp.furigana||'', job:inp.job||'',
    status:inp.pc_status||'alive', cls:parseInt(inp.ark_class)||0, branch:parseInt(inp.ark_branch)||0,
    img:inp.charImage?fixDropbox(inp.charImage):'',
    crop:(()=>{ const f=(k,d)=>{ const v=parseFloat(inp[k]); return isNaN(v)?d:v; }; return {z:f('ark_img_z',100),x:f('ark_img_x',0),y:f('ark_img_y',0)}; })(),
    defDesc:inp.ark_def_desc||'',
    extraOutfits:(()=>{ try{ const v=JSON.parse(inp.ark_outfits||'[]'); return Array.isArray(v)?v.filter(o=>o&&o.url):[]; }catch(e){ return []; } })(),
    ab, sub, sanNow:sanNow==null?(v(ab.pow)*5):sanNow, sanMax:99-mythos, sanInit:v(ab.pow)*5+add('san'),
    prof:[['職業',inp.job],['年齢',inp.age],['性別',inp.gender],['身長',inp.height],['体重',inp.weight],['出身',inp.origin],['誕生日',inp.birthday],['髪の色',inp.hair],['瞳の色',inp.eye],['時代',inp.era]].filter(x=>x[1]&&String(x[1]).trim()),
    freeMemo:inp.row1_memo||'',
    tokucho:[[inp.t1_sel,inp.t1_memo],[inp.t2_sel,inp.t2_memo]].map(([v,m])=>({l:tokuchoLabel(v),m:(m||'').trim()})).filter(x=>x.l||x.m),
    voices:(()=>{ try{ const v=JSON.parse(inp.ark_voices||'[]'); return Array.isArray(v)?v.filter(x=>x&&x.url):[]; }catch(e){ return []; } })(),
    scenarios:(sheet.scenarios||[]).filter(x=>x&&x.trim()),
    sk, memos:(sheet.memos||[]).filter(m=>m&&(m.title||m.body)),
    rels:(sheet.rels||[]).filter(r=>r&&(r.name||(r.rows||[]).some(x=>x.title||x.body))),
    secrets:(sheet.secrets||[]).filter(x=>x&&(x.title||x.summary||(x.contents||[]).some(t=>t)))
  };
}

let worn=0, osel=0;
function renderStage(){
  const c=D;
  const om=(tab==='outfit');
  const O=(c.outfits||[{img:c.img,crop:c.crop,name:'デフォルト',desc:''}])[om?osel:worn]||{};
  const clsHtml=(c.cls>=1&&c.cls<=ARK_ICONS.length)?`<span class="cls" title="${ARK_ICONS[c.cls-1].n}"><img src="${ARK_ICONS[c.cls-1].s}" alt=""></span>`:'';
  return `<div id="stage"${om?' class="outfit-mode"':''}>`+
    (O.img?`<img class="art" src="${esc(O.img)}" alt="${esc(c.name)}" style="--z:${O.crop.z};--x:${O.crop.x};--y:${O.crop.y}" onerror="this.remove()">`:`<div class="empty">${esc(c.name.charAt(0))}</div>`)+
    (om?`<div class="ocard"><div class="ocard-nm">${esc(O.name)}</div><div class="ocard-sub">OUTFIT</div>${O.desc?`<div class="ocard-desc">${esc(O.desc)}</div>`:''}</div>`:'')+
    `<span class="stbadge" style="background:${ST_COLOR[c.status]||'#555'}">${ST_LABEL[c.status]||''}</span>`+
    `<div id="nameplate"><div class="role"><div class="san" style="--p:${Math.max(0,Math.min(100,c.sanNow/99*100)).toFixed(1)}"><span class="lab">SAN</span><span class="val">${c.sanNow}</span></div>${clsHtml}</div>`+
    (c.furigana?`<div class="en">${esc(c.furigana)}</div>`:'')+
    `<div class="nm">${esc(c.name)}</div></div>`+
    `<div id="dialog"><span class="tag">VOICE</span><span id="dtext"></span></div>`+
    (c.job?`<div id="credit"><div class="cr"><i>${SVG.prof}</i><span>${esc(c.job)}</span></div></div>`:'')+
    `</div>`;
}
function body(k){
  const c=D;
  if(k==='prof'){
    const lw=Math.max(0,...c.prof.map(([a])=>a.length));
    let h=`<div class="ph">基本情報</div>`+(c.prof.length?`<div class="pt">${c.prof.map(([a,b])=>`【${a}${'　'.repeat(lw-a.length)}】${esc(b)}`).join('\n')}</div>`:`<p class="hint">登録されていません。</p>`);
    // 基本情報の下に特徴表
    if(c.tokucho.length)h+=`<div class="ph">特徴表</div>`+c.tokucho.map(t=>`<div class="pt">${t.l?`<b>${esc(t.l)}</b>`:''}${t.l&&t.m?'\n':''}${esc(t.m)}</div>`).join('');
    // その下にメモ（自由メモ・その他メモ）
    if(c.freeMemo.trim())h+=`<div class="ph memo">自由メモ</div><div class="pt memo">${esc(c.freeMemo)}</div>`;
    h+=c.memos.map(m=>`<div class="ph memo">${esc(m.title||'メモ')}</div><div class="pt memo">${esc(m.body||'')}</div>`).join('');
    return h;
  }
  if(k==='outfit'){
    const L=c.outfits;
    return `<div class="owrap"><div class="otabs">${L.map((o,i)=>`<button class="${i===osel?'on':''}" onclick="selOutfit(${i})">${esc(o.name)}</button>`).join('')}</div>`+
      `<div class="ostrip"><button class="oarr" onclick="selOutfit(${(osel-1+L.length)%L.length})">◀</button><div class="othumbs">`+
      L.map((o,i)=>`<div class="othumb${i===osel?' sel':''}" onclick="selOutfit(${i})">${o.img?`<img src="${esc(o.img)}" alt="" style="--z:${o.crop.z};--x:${o.crop.x};--y:${o.crop.y}">`:''}${i===worn?'<span class="owear">着用中</span>':''}</div>`).join('')+
      `</div><button class="oarr" onclick="selOutfit(${(osel+1)%L.length})">▶</button></div>`+
      `<div class="obtnrow">${osel===worn?`<button class="obtn worn" disabled>着用中</button>`:`<button class="obtn" onclick="wearOutfit()">着替える</button>`}</div>`+
      `<p class="hint" style="text-align:center">着替えると、立ち絵が差し替えられます</p></div>`;
  }
  if(k==='voice'){
    return c.voices.map((v,i)=>`<button class="vbtn${playing===i?' playing':''}" onclick="playVoice(${i})"><span class="ic">${playing===i?'■':'▶'}</span><span class="tt">${esc(v.title||'(無題)')}</span><span class="bar" id="vbar${i}"></span></button>`).join('');
  }
  if(k==='stat'){
    const L={str:'STR',con:'CON',pow:'POW',dex:'DEX',app:'APP',siz:'SIZ',int_v:'INT',edu:'EDU'};
    const cell=(a,b)=>`<div>【${a}】${esc(String(b))}</div>`;
    let h=`<div class="ph">能力値</div><div class="abtxt">${Object.keys(L).map(a=>cell(L[a],c.ab[a]==null?'-':c.ab[a])).join('')}</div>`;
    h+=`<div class="ph">副能力値</div><div class="abtxt">${cell('SAN',c.sanNow)}${Object.entries(c.sub).map(([a,b])=>cell(a,b)).join('')}${cell('初期SAN',c.sanInit)}${cell('最大SAN',c.sanMax)}</div>`;
    // 技能（同じタブ内）
    if(!c.sk.length) return h+`<div class="ph">技能</div><p class="hint">ポイントを振った技能がありません。</p>`;
    return h+SEC_DEF.map(([sk,lab])=>{
      const list=c.sk.filter(s=>s.sec===sk).sort((a,b)=>(a.ord<0?999:a.ord)-(b.ord<0?999:b.ord));
      if(!list.length)return'';
      return `<div class="ph">${lab}</div><div class="skgrid">${list.map(s=>`<div><span>${esc(s.nm)}</span><b>${s.total}</b></div>`).join('')}</div>`;
    }).join('');
  }
  if(k==='rel'){
    return c.rels.map(r=>`<div class="ph">${esc(r.name||'関係')}</div>`+(r.rows||[]).filter(x=>x.title||x.body).map(x=>`<div class="pt">${x.title?`<b>${esc(x.title)}</b>\n`:''}${esc(x.body||'')}</div>`).join('')).join('')||`<p class="hint">人間関係がありません。</p>`;
  }
  if(k==='secret'){
    return c.secrets.map((s,i)=>{
      let h=`<div class="ph memo">${esc(s.title||'ネタバレ')}</div>`;
      if(s.summary)h+=`<div class="pt memo">${esc(s.summary)}</div>`;
      const cs=(s.contents||[]).map((t,j)=>({t:(s.contentTitles||[])[j]||'',b:t||''})).filter(x=>x.t||x.b);
      if(!cs.length)return h;
      if(unlocked.has(i)){
        h+=cs.map(x=>`<div class="pt memo">${x.t?`<b>${esc(x.t)}</b>\n`:''}${esc(x.b)}</div>`).join('')+`<div class="sec-lock"><button onclick="lockSecret(${i})">閉じる</button></div>`;
      }else{
        h+=`<div class="sec-lock">${s.pass?`<span>PASS</span><input type="password" id="spass${i}" placeholder="パスワード" onkeydown="if(event.key==='Enter')unlockSecret(${i})">`:''}<button onclick="unlockSecret(${i})">解除</button></div>`;
      }
      return h;
    }).join('')||`<p class="hint">ネタバレメモがありません。</p>`;
  }
  if(k==='scen'){
    return c.scenarios.length?`<div class="pt">${c.scenarios.map(esc).join('\n')}</div>`:`<p class="hint">通過シナリオがありません。</p>`;
  }
  return '';
}
const unlocked=new Set();
function unlockSecret(i){
  const s=D.secrets[i]; if(!s)return;
  const inp=document.getElementById('spass'+i);
  if(!s.pass||(inp&&inp.value===s.pass)){ unlocked.add(i); openTab(tab); }
  else alert('パスワードが違います');
}
function lockSecret(i){ unlocked.delete(i); openTab(tab); }
let audio=null, playing=-1;
let typeTimer=null;
function showLine(t){
  const d=document.getElementById('dialog'), x=document.getElementById('dtext'); if(!d||!x)return;
  clearInterval(typeTimer);
  if(!t){ d.classList.remove('show'); x.textContent=''; return; }
  d.classList.add('show'); x.textContent='';
  // 1文字ずつ表示
  const ch=[...t]; let n=0;
  typeTimer=setInterval(()=>{ n+=1; x.textContent=ch.slice(0,n).join(''); if(n>=ch.length)clearInterval(typeTimer); },40);
}
function stopVoice(){ if(audio){ try{audio.pause();}catch(_){} audio=null; } playing=-1; showLine(''); }
function playVoice(i){
  const was=playing; stopVoice();
  if(was===i){ openTab(tab); return; }
  const v=D.voices[i]; if(!v)return;
  audio=new Audio(fixDropbox(v.url)); playing=i; showLine((v.line||'').trim());
  audio.ontimeupdate=()=>{ const b=document.getElementById('vbar'+i); if(b&&audio&&audio.duration) b.style.width=(audio.currentTime/audio.duration*100)+'%'; };
  audio.onended=()=>{ stopVoice(); openTab(tab); };
  audio.play().catch(()=>{ stopVoice(); openTab(tab); alert('再生できませんでした'); });
  openTab(tab);
}
function icoBtn(t,cls,onclick){ return `<button class="ico ${cls||''}" title="${t.label}" onclick="${onclick}">${t.ic}<span class="plus">＋</span></button>`; }
function renderSide(){
  if(!tab){
    return `<div id="side" class="cards">${tabs().map(t=>`<button class="card-tab" onclick="openTab('${t.k}')"><span class="ico">${t.ic}<span class="plus">＋</span></span><span class="ct-label">${t.label}</span></button>`).join('')}</div>`;
  }
  const T=tabs().find(x=>x.k===tab);
  return `<div id="side" class="open"><div class="vmain"><div class="vhead">${icoBtn(T,'',"openTab(null)")}<span class="vh-line"></span><span class="vh-label">${T.label}</span></div><div class="vbody">${body(tab)}</div></div>`+
    `<div class="rail">${tabs().filter(t=>t.k!==tab).map(t=>icoBtn(t,'',`openTab('${t.k}')`)).join('')}</div></div>`;
}
function openTab(k){
  if(k!=='voice'&&tab==='voice'&&k!==tab) stopVoice();
  const prev=tab; tab=k;
  // コーデタブの出入りはステージも描き直す
  if(k==='outfit'||prev==='outfit'){ if(k==='outfit'&&prev!=='outfit')osel=worn; render(); if(k==='outfit')requestAnimationFrame(centerOutfit); return; }
  const s=document.getElementById('side'); if(s)s.outerHTML=renderSide();
}
// 選択中のコーデ（名前タブ・サムネ）を横方向の中央へ
function centerOutfit(){
  [['.othumbs','.othumb.sel'],['.otabs','.otabs button.on']].forEach(([w,e])=>{
    const box=document.querySelector(w), el=document.querySelector(e); if(!box||!el)return;
    // 回転表示でも正しく中央に来るよう、画面座標ではなくレイアウト座標で計算
    if(getComputedStyle(box).position==='static')box.style.position='relative';
    box.scrollLeft=el.offsetLeft+el.offsetWidth/2-box.clientWidth/2;
  });
}

// 職種ごとの配置位置（近距離／遠距離）
const CLS_POS={1:'遠距離',2:'近距離',3:'遠距離',4:'近距離',5:'近距離',6:'遠距離',7:'近距離',8:'遠距離'};
// 攻撃範囲（[前方,上下] の配列。[0,0]=自身のマス）を小さなマス目で描く
function rangeHTML(r){
  if(!r||!r.length) return '';
  const xs=r.map(p=>p[0]), ys=r.map(p=>p[1]);
  const x0=Math.min(0,...xs), x1=Math.max(0,...xs), y0=Math.min(0,...ys), y1=Math.max(0,...ys);
  const set=new Set(r.map(p=>p[0]+','+p[1]));
  let h=`<div class="t-rg" style="grid-template-columns:repeat(${x1-x0+1},1fr)">`;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){
    h+=`<i class="${x===0&&y===0?'me':set.has(x+','+y)?'on':''}"></i>`;
  }
  return h+'</div>';
}
function renderTop(){
  const c=D, O=(c.outfits||[])[worn]||{img:c.img};
  const ci=(c.cls>=1&&c.cls<=ARK_ICONS.length)?ARK_ICONS[c.cls-1]:null;
  const L=[['str','STR'],['con','CON'],['pow','POW'],['dex','DEX'],['app','APP'],['siz','SIZ'],['int_v','INT'],['edu','EDU']];
  const pct=Math.max(0,Math.min(100,c.sanMax>0?c.sanNow/c.sanMax*100:0));
  const hasOutfit=(c.outfits||[]).length>1;
  const brL=ARK_BRANCHES[c.cls], brI=(brL&&c.branch>=1&&c.branch<=brL.length)?brL[c.branch-1]:null;
  return `<div id="top">`+
    `<div class="t-bg"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>`+
    (ci?`<img class="t-clsbg" src="${ci.s}" alt="">`:'')+
    (O.img?`<img class="t-art" src="${esc(O.img)}" alt="" style="--z:${(O.crop||c.crop).z};--x:${(O.crop||c.crop).x};--y:${(O.crop||c.crop).y}" onerror="this.remove()">`:`<div class="t-noimg">${esc(c.name.charAt(0))}</div>`)+
    // 上部ボタン（参考画像の ⓘ と ハンガー の位置）
    // 上部中央：左＝情報（プロフィール）、右＝コーデ（参考画像のノード／ハンガーのボタン）
    `<div class="t-topbtns"><button class="tb" title="情報" onclick="openDetail()">${TSVG.node}</button><i></i>`+
    `<button class="tb" title="コーデ" ${hasOutfit?'':'disabled'} onclick="openOutfit()">${TSVG.hanger}</button></div>`+
    `<div class="t-left">`+
      `<div class="t-ab">${L.map(([k,l])=>`<div><b>${l}</b><span>${c.ab[k]==null?'-':c.ab[k]}</span></div>`).join('')}</div>`+
      (c.furigana?`<div class="t-en">${esc(c.furigana)}</div>`:'')+
      `<div class="t-nm">${esc(c.name)}</div>`+
      `<div class="t-bottom">`+
        (ci?`<div class="t-cls" title="${ci.n}"><img src="${ci.s}" alt=""></div>`:'')+
        (brI?`<div class="t-range">${rangeHTML(brI.r)}<span>攻撃範囲</span></div>`:'')+
        `<div class="t-tags">${ci?`<div class="t-tag">${(brI&&brI.p)||CLS_POS[c.cls]||''}</div>`:''}${c.job?`<div class="t-tag t-tag2">${esc(c.job)}</div>`:''}</div>`+
      `</div>`+
    `</div>`+
    // SAN（LVの位置）
    `<div class="t-right"><div class="t-sanbox"></div><div class="t-san" style="--p:${pct.toFixed(1)}"><span class="lab">SAN</span><span class="val">${c.sanNow}</span></div><div class="t-sanmax">/${c.sanMax}</div></div>`+
    // HP・MP（昇進・潜在の位置）
    `<div class="t-st t-st1"><span class="sv">${c.sub.HP}</span><span class="sl">HP</span></div>`+
    `<div class="t-st t-st2"><span class="sv">${c.sub.MP}</span><span class="sl">MP</span></div>`+
    // 職分（モジュールの位置）
    ((brI||c.tokucho.length)?`<div class="t-branch">`+
      (brI?`<div class="t-brin"><img src="${brI.s}" alt=""><span>${esc(brI.n)}</span></div><div class="t-brd">${esc(brI.d)}</div>`:'')+
      (c.tokucho.filter(t=>t.l).length?`<div class="t-tk">${c.tokucho.filter(t=>t.l).map(t=>`<span>${esc(t.l.replace(/^（[^）]*）/,''))}</span>`).join('')}</div>`:'')+
    `</div>`:'')+
  `</div>`;
}
function fitTopName(){
  const el=document.querySelector('#top .t-nm'); if(!el)return;
  el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize)||48;
  while(el.scrollWidth>el.clientWidth+1 && fs>14){ fs-=1; el.style.fontSize=fs+'px'; }
}
window.addEventListener('resize',()=>{ if(view==='top') requestAnimationFrame(fitTopName); });
function goTop(){ stopVoice(); view='top'; tab=null; render(); }
function openDetail(){ view='detail'; tab=null; render(); }
function openOutfit(){ if((D.outfits||[]).length<2)return; view='detail'; tab='outfit'; osel=worn; render(); requestAnimationFrame(centerOutfit); }

async function init(){
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const msg=t=>{document.getElementById('main').innerHTML='<div id="msg">'+t+'</div>';};
  if(!id){msg('IDが指定されていません');return;}
  let row=null;
  try{ const r=await db.from('character_sheets').select('*').eq('id',id).single(); if(!r.error&&r.data)row=r.data; }catch(e){}
  if(!row){ try{ if(window.OCO){ const rec=await OCO.getOne(id); if(rec&&rec.data)row={id,char_name:rec.char_name,data:rec.data}; } }catch(_){} }
  if(!row){msg('データが見つかりません');return;}
  let sheet={}; try{sheet=JSON.parse(row.data)||{};}catch(e){}
  if(sheet.share_rev && params.get('r')!==sheet.share_rev){
    msg('このリンクは無効です。<br>閲覧URLが再生成された可能性があります。<br>最新のURLを共有者にご確認ください。');return;
  }
  D=build(row);
  // コーデ一覧（0=デフォルト）
  const num2=(v,d)=>{ v=parseFloat(v); return isNaN(v)?d:v; };
  D.outfits=[{name:'デフォルト',img:D.img,desc:D.defDesc,crop:D.crop}].concat(D.extraOutfits.map((o,i)=>({name:o.name||('コーデ'+(i+1)),img:fixDropbox(o.url),desc:o.desc||'',crop:{z:num2(o.z,100),x:num2(o.x,0),y:num2(o.y,0)}})));
  try{ const w=parseInt(localStorage.getItem('ark_wear_'+D.id)); if(w>=0&&w<D.outfits.length)worn=w; }catch(_){}
  osel=worn;
  render();
}
// スマホ縦持ちなら横向きに回転、低い画面はコンパクト表示
function fitView(){
  let w=window.innerWidth, h=window.innerHeight; const app=document.getElementById('app');
  const rot = h>w && w<=760;
  document.documentElement.classList.toggle('rot',rot);
  // ノッチ・ステータスバー・ホームバー（セーフエリア）を避ける
  let pr=document.getElementById('_safe_probe');
  if(!pr){ pr=document.createElement('div'); pr.id='_safe_probe'; pr.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(pr); }
  const cs=getComputedStyle(pr), st=parseFloat(cs.paddingTop)||0, sb=parseFloat(cs.paddingBottom)||0, sl=parseFloat(cs.paddingLeft)||0, sr=parseFloat(cs.paddingRight)||0;
  if(rot){ app.style.top=st+'px'; app.style.left=sl+'px'; app.style.width=(h-st-sb)+'px'; app.style.height=(w-sl-sr)+'px'; } else { app.style.top=''; app.style.left=''; app.style.width=''; app.style.height=''; }
  if(rot){ h=h-st-sb; w=w-sl-sr; }
  document.documentElement.classList.toggle('compact',(rot?w:h)<=520);
  // 画面（回転時はアプリ）の高さ・幅の1%（vh/vw の代わり）
  document.documentElement.style.setProperty('--u',((rot?w:h)/100)+'px');
  document.documentElement.style.setProperty('--uw',((rot?h:w)/100)+'px');
}
window.addEventListener('resize',fitView);
window.addEventListener('orientationchange',()=>setTimeout(fitView,200));
fitView();
init();
</script>
</body>
</html>
