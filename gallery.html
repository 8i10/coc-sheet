<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>探索者一覧</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+JP:wght@200;300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --bg:#0e0e10;--surface:#16161a;--border:#2a2a30;--text:#e8e6e0;--muted:#b4b2a8;--accent:#c9a96e;--accent-dim:rgba(201,169,110,0.15); }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Serif JP',serif;min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,169,110,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}
  header{position:relative;z-index:1;padding:4rem 2rem 2rem;text-align:center;border-bottom:1px solid var(--border);}
  h1{font-size:clamp(1.2rem,3vw,2rem);font-weight:200;letter-spacing:0.5em;opacity:0;animation:fadeUp 0.8s ease forwards 0.2s;}
  .header-line{display:flex;align-items:center;gap:1rem;justify-content:center;margin-top:1.5rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.35s;}
  .header-line::before,.header-line::after{content:'';flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--accent));}
  .header-line::after{background:linear-gradient(90deg,var(--accent),transparent);}
  .header-ornament{color:var(--accent);font-family:'Cormorant Garamond',serif;font-size:1.2rem;}
  .search-wrap{position:relative;z-index:1;display:flex;justify-content:flex-end;padding:1.5rem 2rem 0;opacity:0;animation:fadeUp 0.8s ease forwards 0.45s;}
  .search-box{position:relative;width:280px;max-width:100%}
  .search-input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.5rem 1rem 0.5rem 2.2rem;font-family:'Noto Serif JP',serif;font-size:0.8rem;width:100%;outline:none;transition:border-color 0.2s;}
  .search-input:focus{border-color:var(--accent);}
  .search-icon{position:absolute;left:0.75rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:0.8rem;pointer-events:none;}
  .controls{position:relative;z-index:1;display:flex;flex-direction:column;gap:0.5rem;align-items:center;padding:1rem 2rem;opacity:0;animation:fadeUp 0.8s ease forwards 0.5s;}
  .filter-group{display:flex;gap:0.4rem;flex-wrap:wrap;justify-content:center;}
  .filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.3rem 0.85rem;font-family:'Noto Serif JP',serif;font-size:0.7rem;letter-spacing:0.08em;cursor:pointer;transition:all 0.2s;}
  .filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;padding:1.5rem 2rem 2rem;max-width:1200px;margin:0 auto;}
  .msg{grid-column:1/-1;text-align:center;color:var(--muted);font-size:0.8rem;padding:3rem 0;letter-spacing:0.1em}
  .card{background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:transform 0.25s ease,border-color 0.25s ease,box-shadow 0.25s ease;opacity:0;animation:fadeUp 0.6s ease forwards;position:relative;overflow:hidden;}
  .card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 0 1px var(--accent-dim);}
  .card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0;transition:opacity 0.25s;z-index:2}
  .card:hover::before{opacity:1;}
  .card-portrait{width:100%;aspect-ratio:1/1;background:#1a1a1f;overflow:hidden;position:relative;}
  .portrait-img{position:absolute;inset:0;background-repeat:no-repeat;transition:transform 0.4s ease;}
  .card:hover .portrait-img{transform:scale(1.04);}
  .card-portrait-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .placeholder-monogram{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:300;opacity:0.2;}
  .card-status-badge{position:absolute;top:10px;right:10px;padding:0.2rem 0.6rem;font-size:0.65rem;letter-spacing:0.1em;z-index:1}
  .st-alive{background:rgba(100,160,100,0.2);color:#8cc48c;border:1px solid rgba(100,160,100,0.4);}
  .st-dead{background:rgba(160,80,80,0.2);color:#c48c8c;border:1px solid rgba(160,80,80,0.4);}
  .st-missing{background:rgba(160,160,100,0.2);color:#c4c48c;border:1px solid rgba(160,160,100,0.4);}
  .st-retired{background:rgba(100,100,160,0.2);color:#8c8cc4;border:1px solid rgba(100,100,160,0.4);}
  .st-insane{background:rgba(140,90,160,0.2);color:#b48cc4;border:1px solid rgba(140,90,160,0.4);}
  .card-body{padding:1rem 1.25rem 1.25rem;}
  .card-furigana{font-size:0.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);letter-spacing:0.18em;margin-bottom:0.12rem;}
  .card-name{font-size:0.95rem;font-weight:300;letter-spacing:0.06em;margin-bottom:0.6rem;white-space:nowrap;overflow:hidden}
  .card-meta{display:flex;gap:0.75rem;font-size:0.66rem;color:var(--muted);padding-bottom:0.6rem;border-bottom:1px solid var(--border);margin-bottom:0.6rem;min-height:1.6rem}
  .card-quote{font-size:0.62rem;color:var(--muted);line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1em}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:100;display:flex;align-items:center;justify-content:center;padding:1.5rem;opacity:0;pointer-events:none;transition:opacity 0.2s;backdrop-filter:blur(4px);}
  .modal-overlay.open{opacity:1;pointer-events:all;}
  .modal{background:var(--surface);border:1px solid var(--border);max-width:720px;width:100%;max-height:90vh;overflow-y:auto;transform:translateY(16px);transition:transform 0.2s;position:relative;}
  .modal-overlay.open .modal{transform:translateY(0);}
  .modal-close{position:absolute;top:1rem;right:1rem;background:none;border:1px solid var(--border);color:var(--muted);width:2rem;height:2rem;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all 0.2s;z-index:10;}
  .modal-close:hover{border-color:var(--accent);color:var(--accent);}
  .modal-top{display:grid;grid-template-columns:240px 1fr;}
  @media(max-width:560px){.modal-top{grid-template-columns:1fr;}}
  .modal-portrait{background:#1a1a1f;aspect-ratio:1/1;overflow:hidden;align-self:start;position:relative}
  .modal-portrait-placeholder{width:100%;height:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
  .modal-info{padding:2rem;overflow-y:auto;}
  .modal-furigana{font-size:0.7rem;color:var(--muted);letter-spacing:0.2em;margin-bottom:0.3rem;}
  .modal-name{font-size:1.4rem;font-weight:200;letter-spacing:0.1em;margin-bottom:1rem;}
  .modal-meta-row{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:0.75rem;color:var(--muted);padding:0.75rem 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);}
  .modal-meta-row span strong{color:var(--text);display:block;font-weight:400;font-size:0.85rem;}
  .modal-stats-inline{margin-top:1rem;}
  .stats-block-label{font-size:0.6rem;color:var(--muted);letter-spacing:0.12em;margin-bottom:0.3rem;margin-top:0.6rem;}
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:0.3rem;}
  .stat-item{background:var(--bg);border:1px solid var(--border);padding:0.4rem 0.3rem;text-align:center;}
  .stat-label{font-size:0.55rem;color:var(--muted);letter-spacing:0.08em;}
  .stat-val{font-family:'Cormorant Garamond',serif;font-size:1.1rem;color:var(--accent);}
  .modal-body{padding:0 2rem 2rem;}
  .modal-section-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--accent);letter-spacing:0.2em;margin-bottom:0.6rem;margin-top:1.5rem;}
  .modal-profile{font-size:0.82rem;line-height:2;color:var(--text);opacity:0.9;white-space:pre-wrap;word-break:break-word}
  .modal-profile h4{font-weight:400;color:var(--accent);font-size:0.78rem;letter-spacing:0.1em;margin-top:0.6rem}
  .traits-table{width:100%;border-collapse:collapse;font-size:0.78rem;margin-top:0.5rem;}
  .traits-table th{background:rgba(201,169,110,0.08);color:var(--accent);font-weight:400;letter-spacing:0.08em;padding:0.4rem 0.6rem;border:1px solid var(--border);font-size:0.7rem;}
  .traits-table td{padding:0.4rem 0.6rem;border:1px solid var(--border);color:var(--text);line-height:1.6;vertical-align:top;}
  .traits-table td:first-child{white-space:nowrap;text-align:center}
  .traits-table tr:nth-child(even) td{background:rgba(255,255,255,0.02);}
  .accordion{border:1px solid var(--border);margin-top:1rem;}
  .accordion-header{display:flex;align-items:center;justify-content:space-between;padding:0.6rem 0.9rem;cursor:pointer;font-size:0.75rem;color:var(--muted);letter-spacing:0.08em;user-select:none;transition:background 0.15s,color 0.15s;}
  .accordion-header:hover{background:rgba(255,255,255,0.03);color:var(--text);}
  .accordion-title{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--accent);font-size:0.8rem;letter-spacing:0.15em;}
  .accordion-count{font-size:0.68rem;color:var(--muted);margin-left:0.5rem;}
  .accordion-arrow{font-size:0.6rem;transition:transform 0.2s;color:var(--accent);}
  .accordion.open .accordion-arrow{transform:rotate(180deg);}
  .accordion-body{display:none;padding:0.75rem 1rem 1rem;border-top:1px solid var(--border);}
  .accordion.open .accordion-body{display:block;}
  .session-list{list-style:none;display:flex;flex-direction:column;gap:0.4rem;}
  .session-list li{font-size:0.78rem;color:var(--muted);padding-left:1em;position:relative;line-height:1.6;}
  .session-list li::before{content:'—';position:absolute;left:0;color:var(--accent);font-size:0.7rem;}
  footer{position:relative;z-index:1;text-align:center;padding:3rem 2rem;border-top:1px solid var(--border);margin-top:2rem;}
  .footer-link{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:0.8rem;color:var(--muted);text-decoration:none;letter-spacing:0.1em;border:1px solid var(--border);padding:0.4rem 1.2rem;transition:all 0.2s;}
  .footer-link:hover{color:var(--accent);border-color:var(--accent);}
  @media(max-width:560px){.search-wrap{padding:1.25rem 1rem 0}.search-box{width:100%}.grid{padding:1rem;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.controls{padding:1rem}.modal-overlay{padding:0.75rem}.modal-info{padding:1.25rem}.modal-body{padding:0 1.25rem 1.5rem}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<header>
  <h1>探索者一覧</h1>
  <div class="header-line"><span class="header-ornament">✦</span></div>
</header>
<div class="search-wrap"><div class="search-box">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="searchInput" type="text" placeholder="PC名・ふりがな・通過シナリオで検索…" oninput="renderGrid()">
</div></div>
<div class="controls" id="controls"></div>
<div class="grid" id="grid"><div class="msg">読み込み中…</div></div>
<footer><a href="./index.html" class="footer-link">✎ 編集ページへ</a></footer>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-top">
      <div class="modal-portrait" id="modalPortrait"></div>
      <div class="modal-info">
        <div class="modal-furigana" id="modalFurigana"></div>
        <div class="modal-name" id="modalName"></div>
        <div class="modal-meta-row" id="modalMeta"></div>
        <div class="modal-stats-inline" id="modalStatsInline"></div>
      </div>
    </div>
    <div class="modal-body">
      <div id="modalProfileWrap"></div>
      <div id="modalTraitsWrap"></div>
      <div id="modalSessionsWrap" style="margin-top:1.5rem"></div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://cicodhxebyqewfnngfwt.supabase.co/';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNpY29kaHhlYnlxZXdmbm5nZnd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNzM4NDYsImV4cCI6MjA5NTY0OTg0Nn0.huLOglTPbW1CcGDbDB_yf5ftqEkqmtJ1HBY9WTx9J8E';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const tokuchoLabels=["（1-1）君は風邪を引かない","（1-2）大きな体","（1-3）素早い","（1-4）オシャレ","（1-5）天才","（1-6）強固な意志","（1-7）勉強家","（1-8）幸運のお守り","（1-9）一族伝来の宝物","（1-10）予期せぬ協力者","（2-1）手先が器用","（2-2）影が薄い","（2-3）親の七光り","（2-4）愛書家","（2-5）鋭い洞察力","（2-6）アウトドア派","（2-7）珍しい技能","（2-8）芸銃的才能","（2-9）バイリンガル","（2-10）前職","（3-1）天気予報士","（3-2）プロ・ドライバー","（3-3）飛ばし屋","（3-4）戦士","（3-5）銃火器の達人","（3-6）格闘センスの持ち主","（3-7）俊敏","（3-8）信頼のおける人","（3-9）スポーツ万能","（3-10）平凡な容姿","（4-1）目つきが悪い(D)","（4-2）方向音痴(D)","（4-3）異性が苦手（D)","（4-4）動物に嫌われる(D)","（4-5）不思議ちゃん(D)","（4-6）寄せ餌(D)","（4-7）眼鏡をかけている(D)","（4-8）大切なもの(D)","（4-9）暗黒の祖先(D)","（4-10）夜に弱い(D)","（5-1）動物に好かれる","（5-2）斜め上からの発想","（5-3）失敗は発明の母","（5-4）ペット","（5-5）おおらか","（5-6）異物への耐性","（5-7）潜水の名人","（5-8）大酒飲み","（5-9）ド根性","（5-10）受け身","（6-1）奇妙な幸運","（6-2）投擲の才能","（6-3）鋼の筋力","（6-4）実は生きていた","（6-5）急所を見抜く","（6-6）急速な回復力","（6-7）不屈の精神力","（6-8）マニア・コレクター","（6-9）行方不明の家族","（6-10）好意を寄せられている"];

// ふりがな：特徴表など別の値が入っていたら使わない
function cleanFurigana(v){ v=String(v||'').trim(); if(!v)return ''; if(/^[（(]\s*[\d×]+\s*[-－ー]?\s*\d*\s*[）)]/.test(v)||tokuchoLabels.includes(v))return ''; return v; }
// 能力値・技能値が振られているか
function hasStatsAndSkills(s){
  const inp=s.inputs||{};
  const st=['str','con','pow','dex','app','siz','int_v','edu'].some(k=>parseInt(inp[k])>0);
  const sk=(s.skills||[]).some(x=>x&&['job','int','grw','oth'].some(f=>parseInt(x[f])>0));
  return st&&sk;
}
const HIDE_TAGS=['取り込みのみ','【取込のみ】','取込のみ'];
const ST={alive:['生存','st-alive'],lost:['ロスト','st-dead'],permalost:['永久ロスト','st-dead'],dead:['継続不可','st-dead'],missing:['行方不明','st-missing'],retired:['引退','st-retired'],insane:['永久狂気','st-insane']};
let characters=[], activeCat='all', tagOrder=[];

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fixDropbox(url){
  if(!url)return '';
  if(url.includes('dropbox.com')){ let u=url.replace('www.dropbox.com','dl.dropboxusercontent.com').replace('dropbox.com','dl.dropboxusercontent.com'); u=u.replace(/([?&])dl=[01]/,'$1raw=1'); if(!/[?&]raw=1/.test(u))u+=(u.includes('?')?'&':'?')+'raw=1'; return u; }
  return url;
}
function toHira(s){return (s||'').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));}
function tokucho(v){ if(v===''||v==null||v==='ng')return null; const i=parseInt(v,10); const l=(Number.isInteger(i)&&tokuchoLabels[i])||''; if(!l)return null; const m=l.match(/^（([^）]*)）(.*)$/); return m?{dice:m[1],text:m[2]}:{dice:'',text:l}; }
// DB：自動算出（鋼の筋力含む）＋追加分（シートと同じ合算）
function combineDB(a,b){
  const terms=[]; const add=(str)=>{ String(str||'').replace(/\s/g,'').replace(/[ＤｄD]/g,'d').replace(/＋/g,'+').replace(/[－−ー]/g,'-').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/([+-]?)(\d*)(d(\d+))?/gi,(m,sg,n,dd,face)=>{ if(!m||(!n&&!dd))return m; const sign=sg==='-'?-1:1;
      if(dd){ const k='d'+face; const t=terms.find(x=>x.k===k); const v=sign*(parseInt(n||'1',10)); if(t)t.v+=v; else terms.push({k,v}); }
      else { const t=terms.find(x=>x.k==='c'); const v=sign*parseInt(n,10); if(t)t.v+=v; else terms.push({k:'c',v}); }
      return m; }); };
  add(a); add(b);
  return terms.filter(t=>t.v!==0).map(t=>(t.v>0?'+':'-')+(t.k==='c'?Math.abs(t.v):Math.abs(t.v)+'D'+t.k.slice(1))).join('')||'0';
}
function calcDB(inp){
  const ss=(parseInt(inp.str)||0)+(parseInt(inp.siz)||0);
  const steps=['-1D6','-1D4','0','+1D4','+1D6','+2D6'];
  let i=ss<=12?0:ss<=16?1:ss<=24?2:ss<=32?3:ss<=40?4:5;
  let base=steps[i];
  const hag=[inp.t1_sel,inp.t2_sel].some(v=>{ const t=tokucho(v); return t&&t.text.includes('鋼の筋力'); });
  if(hag){ if(i<4)base=steps[i+1]; else base=base+'+1'; }
  const ex=(inp.db_add||'').trim();
  return ex?combineDB(base==='0'?'':base,ex):base;
}

// シートデータ → 表示用（閲覧時の表示設定で隠した項目は載せない）
function toChar(row){
  let s={}; try{ s=JSON.parse(row.data)||{}; }catch(e){}
  const inp=s.inputs||{};
  if(inp.gallery_pub===false)return null; // 初期設定は「載せる」
  if(!hasStatsAndSkills(s))return null; // 能力値・技能値が振られていないPCは載せない
  const off=k=>inp[k]===false;
  const pos=(inp.charImagePos||'50% 30%').split(' ');
  let scen=off('vh_scenario')?[]:(s.scenarios||[]).flatMap(x=>String(x||'').split('\n')).map(x=>x.trim()).filter(Boolean);
  if(inp.gallery_first_scen===false)scen=scen.slice(1); // 出身シナリオ（1行目）を載せない
  return {
    id:row.id,
    name:inp.pcname||row.char_name||'',
    furigana:cleanFurigana(inp.furigana),
    age:off('vh_p_age')?'':(inp.age||''),
    occupation:off('vh_p_job')?'':(inp.job||''),
    birthday:off('vh_p_birthday')?'':(inp.birthday||''),
    status:inp.pc_status||'alive',
    image:fixDropbox(inp.charImage||''),
    ox:parseFloat(pos[0])||50, oy:parseFloat(pos[1]||pos[0])||30, scale:parseFloat(inp.charImageScale)||1.3,
    color:/^#[0-9a-f]{3,8}$/i.test(inp.txtcolor||'')?inp.txtcolor:'#7c9bb5',
    tags:(Array.isArray(s.tags)?s.tags:[]).filter(t=>!HIDE_TAGS.includes(t)),
    stats:off('vh_stats')?null:{STR:inp.str,CON:inp.con,POW:inp.pow,DEX:inp.dex,APP:inp.app,SIZ:inp.siz,INT:inp.int_v,EDU:inp.edu,DB:calcDB(inp)},
    profile:(s.memos||[]).filter(m=>m&&!m.hide&&((m.title||'').trim()||(m.body||'').trim())).map(m=>({t:(m.title||'').trim(),b:(m.body||'').trim()})),
    traits:off('vh_tokucho')?[]:[[inp.t1_sel,inp.t1_memo],[inp.t2_sel,inp.t2_memo]].map(([v])=>tokucho(v)).filter(Boolean),
    sessions:scen
  };
}

async function loadCharacters(){
  const p=new URLSearchParams(location.search);
  const uid=p.get('u');
  try{ tagOrder=JSON.parse(p.get('t')||'[]'); }catch(e){ tagOrder=[]; }
  if(!uid){ document.getElementById('grid').innerHTML='<div class="msg">URLが正しくありません</div>'; return; }
  try{
    const {data,error}=await db.from('character_sheets').select('id,char_name,data').eq('user_id',uid);
    if(error)throw error;
    characters=(data||[]).map(toChar).filter(Boolean);
  }catch(e){ console.warn(e); document.getElementById('grid').innerHTML='<div class="msg">読み込めませんでした</div>'; return; }
  renderFilters(); renderGrid();
}

function renderFilters(){
  const used=[...new Set(characters.flatMap(c=>c.tags))];
  used.sort((a,b)=>{ const ia=tagOrder.indexOf(a), ib=tagOrder.indexOf(b); if(ia!==-1&&ib!==-1)return ia-ib; if(ia!==-1)return -1; if(ib!==-1)return 1; return a.localeCompare(b,'ja'); });
  const cats=['all',...used];
  document.getElementById('controls').innerHTML=used.length?`<div class="filter-group">${cats.map((s,i)=>`<button class="filter-btn ${s===activeCat?'active':''}" data-i="${i}">${s==='all'?'すべて':esc(s)}</button>`).join('')}</div>`:'';
  document.querySelectorAll('#controls .filter-btn').forEach(b=>b.onclick=()=>{ activeCat=cats[+b.dataset.i]; renderFilters(); renderGrid(); });
}

function portraitHTML(c,big){
  return c.image
    ?`<div class="portrait-img" style="background-image:url('${esc(c.image)}');background-size:${Math.round(c.scale*100)}%;background-position:${c.ox}% ${c.oy}%"></div>`
    :`<div class="${big?'modal-portrait-placeholder':'card-portrait-placeholder'}"><span class="placeholder-monogram"${big?' style="font-size:5rem;opacity:0.15"':''}>${esc(c.name?c.name.charAt(0):'?')}</span></div>`;
}

function renderGrid(){
  const q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
  let list=characters;
  if(activeCat!=='all')list=list.filter(c=>c.tags.includes(activeCat));
  if(q)list=list.filter(c=>c.name.toLowerCase().includes(q)||c.furigana.toLowerCase().includes(q)||c.sessions.some(s=>s.toLowerCase().includes(q)));
  list=[...list].sort((a,b)=>toHira(a.furigana||a.name).localeCompare(toHira(b.furigana||b.name),'ja'));
  const g=document.getElementById('grid');
  if(!list.length){ g.innerHTML=`<div class="msg">${characters.length?'該当する探索者がいません':'掲載中の探索者がいません'}</div>`; return; }
  g.innerHTML=list.map((c,i)=>{
    const st=ST[c.status]||ST.alive;
    return `<div class="card" style="animation-delay:${Math.min(i,20)*0.05}s" data-id="${esc(c.id)}">
      <div class="card-portrait" style="background:linear-gradient(160deg,${c.color}22,#1a1a1f)">${portraitHTML(c,false)}<span class="card-status-badge ${st[1]}">${st[0]}</span></div>
      <div class="card-body">
        ${c.furigana?`<div class="card-furigana">${esc(c.furigana)}</div>`:''}
        <div class="card-name">${esc(c.name||'（名前なし）')}</div>
        <div class="card-meta">${c.age?`<span>${esc(c.age)}${/^\d+$/.test(c.age)?'歳':''}</span>`:''}${c.occupation?`<span>${esc(c.occupation)}</span>`:''}</div>
        <div class="card-quote">${esc(c.sessions[0]||'')}</div>
      </div></div>`;
  }).join('');
  g.querySelectorAll('.card').forEach(el=>el.onclick=()=>openModal(el.dataset.id));
  requestAnimationFrame(fitNames);
}

// PC名：1行に収まらなければ文字を小さくする
function fitNames(){
  const els=[...document.querySelectorAll('#grid .card-name')];
  els.forEach(el=>el.style.fontSize='');
  const m=els.map(el=>[el,el.scrollWidth,el.clientWidth,parseFloat(getComputedStyle(el).fontSize)||15]);
  m.forEach(([el,sw,cw,fs])=>{ if(sw>cw+1&&cw>0) el.style.fontSize=Math.max(8,fs*cw/sw-0.3)+'px'; });
}
window.addEventListener('resize',()=>requestAnimationFrame(fitNames));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>requestAnimationFrame(fitNames));
function openModal(id){
  const c=characters.find(x=>x.id===id); if(!c)return;
  const st=ST[c.status]||ST.alive;
  document.getElementById('modalFurigana').textContent=c.furigana;
  document.getElementById('modalName').textContent=c.name;
  document.getElementById('modalMeta').innerHTML=
    (c.age?`<span>年齢<strong>${esc(c.age)}${/^\d+$/.test(c.age)?'歳':''}</strong></span>`:'')+
    (c.occupation?`<span>職業<strong>${esc(c.occupation)}</strong></span>`:'')+
    (c.birthday?`<span>誕生日<strong>${esc(c.birthday)}</strong></span>`:'')+
    `<span>状態<strong>${st[0]}</strong></span>`;
  const mp=document.getElementById('modalPortrait'); mp.style.background=`linear-gradient(160deg,${c.color}22,#1a1a1f)`; mp.innerHTML=portraitHTML(c,true);
  const prim=['STR','CON','POW','DEX','APP','SIZ','INT','EDU'];
  const si=document.getElementById('modalStatsInline');
  if(c.stats&&prim.some(k=>c.stats[k]!==''&&c.stats[k]!=null)){
    si.innerHTML=`<div class="stats-block-label">基本能力値</div><div class="stats-row">`+prim.filter(k=>c.stats[k]!==''&&c.stats[k]!=null).map(k=>`<div class="stat-item"><div class="stat-label">${k}</div><div class="stat-val">${esc(c.stats[k])}</div></div>`).join('')+`</div>`+
      `<div class="stats-row" style="margin-top:0.3rem"><div class="stat-item"><div class="stat-label">DB</div><div class="stat-val" style="font-size:0.9rem">${esc(c.stats.DB)}</div></div></div>`;
  } else si.innerHTML='';
  document.getElementById('modalProfileWrap').innerHTML=c.profile.length?`<div class="modal-section-title">プロフィール</div><div class="modal-profile">${c.profile.map(m=>(m.t?`<h4>${esc(m.t)}</h4>`:'')+esc(m.b)).join('\n')}</div>`:'';
  document.getElementById('modalTraitsWrap').innerHTML=c.traits.length?`<div class="modal-section-title">特徴表</div><table class="traits-table"><thead><tr><th>ダイス</th><th>特徴</th></tr></thead><tbody>${c.traits.map(t=>`<tr><td>${esc(t.dice)}</td><td>${esc(t.text)}</td></tr>`).join('')}</tbody></table>`:'';
  document.getElementById('modalSessionsWrap').innerHTML=c.sessions.length?`<div class="accordion" id="sessAccordion"><div class="accordion-header" onclick="this.parentElement.classList.toggle('open')"><span><span class="accordion-title">通過シナリオ</span><span class="accordion-count">${c.sessions.length}件</span></span><span class="accordion-arrow">▼</span></div><div class="accordion-body"><ul class="session-list">${c.sessions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div></div>`:'';
  document.getElementById('modalOverlay').classList.add('open');
  document.querySelector('#modalOverlay .modal').scrollTop=0;
  document.body.style.overflow='hidden';
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); document.body.style.overflow=''; }
document.getElementById('modalClose').addEventListener('click',closeModal);
document.getElementById('modalOverlay').addEventListener('click',function(e){ if(e.target===this)closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal(); });
loadCharacters();
</script>
</body>
</html>
